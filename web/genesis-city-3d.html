<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GENESIS CITY 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#061423;color:white;font:15px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:fixed;top:12px;left:12px;padding:12px;background:#07182cdd;border:1px solid #e6bc69;border-radius:12px}#actions{position:fixed;top:12px;right:12px;display:flex;gap:8px}button{background:#15364c;color:white;border:1px solid #d9b86b;border-radius:12px;padding:12px;font-weight:bold;touch-action:none}#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;width:68px;height:66px;font-size:23px;background:#0b2439c9}#intro{position:fixed;inset:0;background:#061322df;display:grid;place-items:center;text-align:center}#intro section{padding:28px;max-width:500px;border:2px solid #d9b86b;background:#10243a;border-radius:22px}h1{color:#f5ca74}</style></head><body><canvas id="scene"></canvas><div id="hud"><b>GENESIS CITY 3D</b><div id="stats">Punkty: 0</div><div id="mission">Zbierz złote znaczniki</div></div><div id="actions"><button id="exit">✕ WYJDŹ</button><button id="reset">↻ RESTART</button></div><div id="controls"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div><button data-key="ArrowDown">▼</button><button data-key="ArrowUp">▲</button></div></div><div id="intro"><section><h1>GENESIS CITY 3D</h1><p>Prototyp jazdy z perspektywy za samochodem. Skręcaj i zbieraj złote znaczniki na drodze.</p><p>WASD / strzałki lub przyciski na telefonie.</p><button id="play">▶ ZAGRAJ</button></section></div><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),c=canvas.getContext('2d'),keys=new Set();let w,h,dpr,score=0,x=0,z=0,speed=0,playing=false,last=0;const marks=Array.from({length:25},(_,i)=>({x:Math.sin(i*2.4)*1.4,z:i*75+80,done:false}));const bots=Array.from({length:9},(_,i)=>({x:(i%3-1)*160+200,z:(i%4)*160+200,phase:i}));function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;c.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rect=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)};function car(px,py,size,color){c.save();c.translate(px,py);c.fillStyle='#0008';c.fillRect(-size*.55,-size*.35,size*1.1,size*1.6);c.fillStyle=color;c.fillRect(-size*.43,-size*.5,size*.86,size*1.25);c.fillStyle='#153b54';c.fillRect(-size*.3,-size*.2,size*.6,size*.38);c.fillStyle='#fff7aa';c.fillRect(-size*.38,-size*.49,size*.22,size*.12);c.fillRect(size*.16,-size*.49,size*.22,size*.12);c.restore()}function render3d(){rect(0,0,w,h*.52,'#143b64');rect(0,h*.52,w,h*.48,'#31554a');c.fillStyle='#405b70';for(let i=0;i<26;i++){let bx=(i*97-x*10)%w;c.fillRect(bx,h*.32+(i%4)*12,38+((i*7)%40),h*.23)}const horizon=h*.51;for(let n=22;n>=1;n--){const depth=n/22,p=1/(depth*8+.16),yy=horizon+(h-horizon)*p*.18,half=w*p*.34;c.fillStyle=n%2?'#273641':'#2b3b47';c.beginPath();c.moveTo(w/2-half,yy);c.lineTo(w/2+half,yy);c.lineTo(w/2+half*1.2,yy+30*p);c.lineTo(w/2-half*1.2,yy+30*p);c.fill();c.strokeStyle='#d8c173';c.lineWidth=Math.max(1,p*3);c.beginPath();c.moveTo(w/2,yy);c.lineTo(w/2,yy+13*p);c.stroke()}for(const m of marks){if(m.done)continue;const dz=m.z-z;if(dz<2||dz>500)continue;const p=1/(dz/100+.4),yy=horizon+(h-horizon)*p*.32,px=w/2+(m.x-x)*p*w*.16;c.fillStyle='#f9d16b';c.beginPath();c.arc(px,yy,Math.max(4,p*17),0,7);c.fill()}car(w/2,h*.83,Math.min(w,h)*.12,'#efbc55')}
function renderMulti(){rect(0,0,w,h,'#1d514c');const scale=1.1;for(let i=-8;i<9;i++){rect(w/2-x*scale+i*190-24,0,48,h,'#344856');rect(0,h/2-z*scale+i*190-24,w,48,'#344856')}for(let i=0;i<40;i++){const bx=w/2-x*scale+(i%8-4)*190+34,by=h/2-z*scale+(Math.floor(i/8)-2)*190+34;rect(bx,by,120,120,['#5a7184','#6c6573','#546b69'][i%3])}for(const m of marks){if(m.done)continue;let px=w/2+(m.x*150-x)*scale,py=h/2+(m.z-z)*scale;if(px<0||px>w||py<0||py>h)continue;c.fillStyle='#f7ca62';c.beginPath();c.arc(px,py,14,0,7);c.fill()}for(const b of bots){const bx=w/2+(b.x+Math.sin(Date.now()/900+b.phase)*25-x)*scale,by=h/2+(b.z+Math.cos(Date.now()/900+b.phase)*25-z)*scale;car(bx,by,28,'#7ddad4')}car(w/2,h/2,40,'#ffce68');c.fillStyle='white';c.textAlign='center';c.fillText('TY',w/2,h/2-40)}
function frame(t){if(!playing)return;const dt=Math.min(.04,(t-last)/1000||0);last=t;const up=keys.has('ArrowUp')||keys.has('KeyW'),down=keys.has('ArrowDown')||keys.has('KeyS'),left=keys.has('ArrowLeft')||keys.has('KeyA'),right=keys.has('ArrowRight')||keys.has('KeyD');speed+=(up?110:0)*dt-(down?140:0)*dt;speed*=Math.pow(.985,dt*60);speed=Math.max(-90,Math.min(220,speed));x+=((right?1:0)-(left?1:0))*dt*(2.3);z+=speed*dt;for(const m of marks){if(!m.done&&Math.abs(m.z-z)<18&&Math.abs(m.x*1-x)<0.65){m.done=true;score+=100}}document.getElementById('stats').textContent='Punkty: '+score+' · Prędkość: '+Math.round(Math.abs(speed));render3d();requestAnimationFrame(frame)}
function start(){score=0;x=0;z=0;speed=0;for(const m of marks)m.done=false;playing=true;document.getElementById('intro').style.display='none';last=performance.now();requestAnimationFrame(frame)}document.getElementById('play').onclick=start;document.getElementById('reset').onclick=()=>{playing=false;start()};document.getElementById('exit').onclick=()=>{playing=false;if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-city-exit-fullscreen',game:'city'}),location.origin);else location.href='/'};addEventListener('keydown',e=>{if(e.code.startsWith('Arrow'))e.preventDefault();keys.add(e.code)});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());for(const b of document.querySelectorAll('[data-key]')){b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.key);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(b.dataset.key))} render3d();})();
</script></body></html>
