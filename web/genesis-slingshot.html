function burst(x,y,mat,large=false){let cols=['#b9864c','#d36c49','#a8c6d7','#ffba65'];effects.push({x,y,age:0,large});shake=Math.max(shake,large?7:3);for(let i=0;i<(large?32:16);i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*7;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,t:35+Math.random()*25,color:cols[mat]||cols[3],size:2+Math.random()*5,angle:a,spin:(Math.random()-.5)*.35})}fxTone(large?'robot':'break')}

function pts(e){let r=c.getBoundingClientRect(),s=Math.min(r.width/960,r.height/540);return{x:(e.clientX-r.left-(r.width-960*s)/2)/s,y:(e.clientY-r.top-(r.height-540*s)/2)/s}}
