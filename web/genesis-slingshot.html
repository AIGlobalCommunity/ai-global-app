<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Slingshot</title><style>*{box-sizing:border-box}body{margin:0;background:#081427;color:#ecf8ff;font: bold 16px system-ui;display:grid;grid-template-rows:auto 1fr auto;height:100dvh;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px}button{background:#183d61;color:white;border:1px solid #69dcff;border-radius:10px;padding:10px;cursor:pointer}canvas{width:100%;height:100%;min-height:0;object-fit:contain;touch-action:none}#msg{color:#ffe173}</style><header><button id="exit">✕</button><span>GENESIS SLINGSHOT</span><span id="hud"></span><button id="mute">🔊</button></header><canvas id="c" width="960" height="540"></canvas><footer><span id="msg">Naciągnij kulę i puść. Dotknij w locie, aby aktywować moc.</span><button id="ability">MOC</button><button id="next" hidden>Dalej</button><button id="restart">Od nowa</button><button id="share">Udostępnij</button></footer><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),$=id=>document.getElementById(id),origin={x:145,y:385},types=['Genesis','Destroyer','Splitter','Accelerator','Phantom','Titan'],colors=['#ffd64b','#ff5070','#52c8ff','#63f5a0','#b78aff','#899db8'];let level=1,score=0,ammo=0,shots=[],blocks=[],bots=[],particles=[],drag=null,mode='ready',kind=0,used=false,elapsed=0,sound=true,ac;
function beep(f){if(!sound)return;try{ac??=new AudioContext();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.connect(v);v.connect(ac.destination);v.gain.setValueAtTime(.07,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.start();o.stop(ac.currentTime+.16)}catch{}}
function report(){if(score<10)return;let p={type:'genesis-game-score',game:'slingshot',score,level,at:Date.now()};try{let k='agc-game-pending-slingshot',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<=score)localStorage.setItem(k,JSON.stringify(p))}catch{}if(parent!==window)parent.postMessage(JSON.stringify(p),location.origin)}
function build(){shots=[];blocks=[];bots=[];drag=null;mode='ready';ammo=5+Math.floor(level/8);kind=(level-1)%6;used=false;$('next').hidden=true;$('msg').textContent='Naciągnij kulę i puść. Moc: '+types[kind];let towers=2+Math.floor((level-1)/10);for(let j=0;j<towers;j++){let x=495+j*110,h=2+(level+j)%4;for(let i=0;i<h;i++){let y=480-i*45;for(let d of [0,52])blocks.push({x:x+d,y,w:14,h:40,hp:1+(level+i+j)%3,vx:0,vy:0});blocks.push({x:x-3,y:y-12,w:72,h:12,hp:1+(level+j)%3,vx:0,vy:0});}bots.push({x:x+33,y:470-(h-1)*45,r:14,alive:true,vy:0});bots.push({x:x+33,y:478,r:14,alive:true,vy:0})}update()}
function update(){$('hud').textContent='Poziom '+level+'/30 · '+score+' pkt · Pociski '+ammo+' · '+types[kind]}
function pts(e){let r=c.getBoundingClientRect(),s=Math.min(r.width/960,r.height/540);return{x:(e.clientX-r.left-(r.width-960*s)/2)/s,y:(e.clientY-r.top-(r.height-540*s)/2)/s}}
c.onpointerdown=e=>{if(mode==='flight'){ability();return}if(mode!=='ready')return;let p=pts(e);if(Math.hypot(p.x-origin.x,p.y-origin.y)>90)return;c.setPointerCapture(e.pointerId);drag=p};c.onpointermove=e=>{if(drag){let p=pts(e),dx=p.x-origin.x,dy=p.y-origin.y,s=Math.min(1,115/(Math.hypot(dx,dy)||1));drag={x:origin.x+dx*s,y:origin.y+dy*s}}};c.onpointercancel=()=>drag=null;c.onpointerup=()=>{if(!drag)return;let vx=(origin.x-drag.x)*.19,vy=(origin.y-drag.y)*.19;drag=null;if(Math.hypot(vx,vy)<2)return;shots=[{x:origin.x,y:origin.y,vx,vy,r:15,kind}];ammo--;used=false;elapsed=0;mode='flight';beep(320);update()};
function blast(x,y,r){for(let b of blocks)if(b.hp>0&&Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y)<r){b.hp=0;score+=40}for(let b of bots)if(b.alive&&Math.hypot(b.x-x,b.y-y)<r){b.alive=false;score+=150}for(let i=0;i<25;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,t:35});beep(100);report()}
function ability(){if(mode!=='flight'||used||!shots.length)return;used=true;let p=shots[0];if(p.kind===1)blast(p.x,p.y,115);if(p.kind===2)shots.push({...p,vy:p.vy-5,r:10},{...p,vy:p.vy+5,r:10});if(p.kind===3){p.vx*=1.8;p.vy*=.6}if(p.kind===4)p.phase=true;if(p.kind===5){p.r=25;p.vx*=1.4}beep(850)}
function tick(){if(mode==='flight'){elapsed++;for(let p of shots){p.vy+=.29;p.x+=p.vx;p.y+=p.vy;if(p.y+p.r>500){p.y=500-p.r;p.vy*=-.33;p.vx*=.8}for(let b of blocks)if(b.hp>0&&p.x+p.r>b.x&&p.x-p.r<b.x+b.w&&p.y+p.r>b.y&&p.y-p.r<b.y+b.h&&Math.hypot(p.vx,p.vy)>2){b.hp-=p.kind===5?3:1;if(b.hp<=0){score+=40;blast(b.x+b.w/2,b.y+b.h/2,25)}if(!p.phase){p.vx*=.62;p.vy-=1}beep(180)}for(let b of bots)if(b.alive&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){b.alive=false;score+=150;blast(b.x,b.y,38)}}for(let b of blocks)if(b.hp>0&&b.y+b.h<500&&!blocks.some(o=>o!==b&&o.hp>0&&o.y>=b.y+b.h-2&&o.y<b.y+b.h+5&&o.x<b.x+b.w&&o.x+o.w>b.x)){b.vy+=.2;b.y+=b.vy;if(b.y+b.h>500){b.y=500-b.h;b.vy=0}}for(let b of bots)if(b.alive&&b.y+b.r<500&&!blocks.some(o=>o.hp>0&&o.y>=b.y+b.r-3&&o.y<b.y+b.r+5&&b.x>o.x&&b.x<o.x+o.w)){b.vy+=.3;b.y+=b.vy;if(b.y+b.r>=500){if(b.vy>6){b.alive=false;score+=150}b.y=500-b.r;b.vy=0}}if(!bots.some(b=>b.alive)){score+=ammo*50;mode='won';$('msg').textContent=level===30?'Ukończono wszystkie misje!':'Misja ukończona!';$('next').hidden=level===30;report()}else if(elapsed>330||shots.every(p=>p.x>1000||p.x<0||Math.hypot(p.vx,p.vy)<.8)){shots=[];kind=(kind+1)%6;mode=ammo?'ready':'lost';$('msg').textContent=ammo?'Następny pocisk: '+types[kind]:'Koniec amunicji. Spróbuj ponownie.';report()}update()}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.t--}particles=particles.filter(p=>p.t>0)}
function draw(){let bg=g.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#102c51');bg.addColorStop(1,'#0b1023');g.fillStyle=bg;g.fillRect(0,0,960,540);g.fillStyle='#17394d';for(let i=0;i<12;i++)g.fillRect(i*85,300-i%3*36,65,200+i%3*36);g.fillStyle='#31586a';g.fillRect(0,500,960,40);g.strokeStyle='#54d9ff';g.lineWidth=9;g.beginPath();g.moveTo(145,495);g.lineTo(145,410);g.lineTo(117,370);g.moveTo(145,410);g.lineTo(173,370);g.stroke();for(let b of blocks)if(b.hp>0){g.fillStyle=['','#8ed9ee','#ba8657','#8f9daf'][b.hp]||'#8f9daf';g.fillRect(b.x,b.y,b.w,b.h);g.strokeStyle='#d5eaff';g.lineWidth=1;g.strokeRect(b.x,b.y,b.w,b.h)}for(let b of bots)if(b.alive){g.fillStyle='#ff557d';g.beginPath();g.roundRect(b.x-15,b.y-15,30,30,8);g.fill();g.fillStyle='#10233d';g.fillRect(b.x-11,b.y-6,22,10);g.fillStyle='#fff';g.fillRect(b.x-8,b.y-4,5,5);g.fillRect(b.x+3,b.y-4,5,5)}let list=mode==='ready'?[{...(drag||origin),r:15,kind}]:shots;if(drag){g.strokeStyle='#ffcb70';g.lineWidth=4;g.beginPath();g.moveTo(117,370);g.lineTo(drag.x,drag.y);g.lineTo(173,370);g.stroke();for(let t=3;t<42;t+=4){g.fillStyle='#fff9';g.beginPath();g.arc(origin.x+(origin.x-drag.x)*.19*t,origin.y+(origin.y-drag.y)*.19*t+.145*t*t,2,0,7);g.fill()}}for(let p of list){g.fillStyle=colors[p.kind];g.shadowColor=g.fillStyle;g.shadowBlur=15;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0}for(let p of particles){g.fillStyle='#ffc65c';g.fillRect(p.x,p.y,4,4)}}
let last=0,acc=0;function loop(t){acc+=Math.min(100,t-last||16);last=t;while(acc>=16.67){tick();acc-=16.67}draw();requestAnimationFrame(loop)}$('ability').onclick=ability;$('next').onclick=()=>{level++;build()};$('restart').onclick=()=>{report();score=0;level=1;build()};$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};$('exit').onclick=()=>{report();if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-slingshot-exit-fullscreen',game:'slingshot'}),location.origin);else location.href='/'};$('share').onclick=()=>{report();let u=new URL('/share-result.html',location.origin);u.searchParams.set('game','slingshot');u.searchParams.set('score',score);if(navigator.share)navigator.share({title:'Genesis Slingshot',text:score+' pkt',url:u.href}).catch(()=>{});else window.open(u.href,'_blank')};addEventListener('pagehide',report);build();requestAnimationFrame(loop);
</script></html>
