<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Slingshot</title><style>*{box-sizing:border-box}body{margin:0;background:#081427;color:#ecf8ff;font: bold 16px system-ui;display:grid;grid-template-rows:auto 1fr auto;height:100dvh;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px}button{background:#183d61;color:white;border:1px solid #69dcff;border-radius:10px;padding:10px;cursor:pointer}canvas{width:100%;height:100%;min-height:0;object-fit:contain;touch-action:none}#msg{color:#ffe173}</style><header><button id="exit">✕</button><span>GENESIS SLINGSHOT</span><span id="hud"></span><span id="arsenal"></span><button id="mute">🔊</button></header><div id="demo" style="position:absolute;z-index:5;inset:0;background:#071525eF;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;gap:14px"><canvas id="preview" width="180" height="100" style="width:180px;height:100px;flex:none"></canvas><h2 id="demoTitle"></h2><div id="demoText"></div><button id="demoGo">Rozumiem — graj</button></div><canvas id="c" width="960" height="540"></canvas><footer><span id="msg">Naciągnij kulę i puść. Dotknij w locie, aby aktywować moc.</span><button id="ability">MOC</button><button id="next" hidden>Dalej</button><button id="restart">Od nowa</button><button id="share">Udostępnij</button></footer><script>
const names=['Falcon','Blaze','Trident','Dash','Ram','Titan'],help=['Celny strzał: bez dodatkowej mocy.','Dotknij w locie: fala wybuchowa.','Dotknij w locie: trzy drony.','Dotknij w locie: przyspieszenie.','Dotknij w locie: silny impuls odpychający.','Dotknij w locie: ciężki taran.'];
const c=document.getElementById('c'),g=c.getContext('2d'),$=id=>document.getElementById(id),origin={x:145,y:385},types=['Genesis','Destroyer','Splitter','Accelerator','Phantom','Titan'],colors=['#ffd64b','#ff5070','#52c8ff','#63f5a0','#b78aff','#899db8'];let level=1,score=0,ammo=0,shots=[],blocks=[],bots=[],particles=[],drag=null,mode='ready',kind=0,used=false,elapsed=0,sound=true,ac;
function beep(f){if(!sound)return;try{ac??=new AudioContext();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.connect(v);v.connect(ac.destination);v.gain.setValueAtTime(.07,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.start();o.stop(ac.currentTime+.16)}catch{}}
function report(){if(score<10)return;let p={type:'genesis-game-score',game:'slingshot',score,level,at:Date.now()};try{let k='agc-game-pending-slingshot',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<=score)localStorage.setItem(k,JSON.stringify(p))}catch{}if(parent!==window)parent.postMessage(JSON.stringify(p),location.origin)}
const sprites={};for(const n of ['falcon','blaze','trident','dash','ram','titan','background','background_city','background_desert','background_ice','background_lava','wood_block','wood_beam','brick_block','metal_block','metal_beam','enemy_guard','enemy_drone','enemy_defender','enemy_turret','slingshot','explosion','logo']){let im=new Image();im.src='assets/slingshot/'+n+'.png';sprites[n]=im}function pic(ctx,n,x,y,w,h){let im=sprites[n];if(!im?.complete||!im.naturalWidth)return false;ctx.drawImage(im,x,y,w,h);return true}const material=[{name:'wood',mass:1,hp:3},{name:'brick',mass:2.4,hp:7},{name:'metal',mass:4.5,hp:14}];let queue=[],seen=new Set();function tutorial(){if(seen.has(kind))return;seen.add(kind);$('demoTitle').textContent=names[kind];$('demoText').textContent=help[kind];$('demo').style.display='flex';let ctx=$('preview').getContext('2d');ctx.clearRect(0,0,180,100);unit(ctx,{x:55,y:50,r:28,kind});ctx.fillStyle='#68dfff';ctx.font='bold 25px system-ui';ctx.fillText('→ ✦',100,58)}$('demoGo').onclick=()=>$('demo').style.display='none';function build(){shots=[];blocks=[];bots=[];drag=null;mode='ready';ammo=5+Math.floor(level/8);queue=Array.from({length:ammo},(_,i)=>(level-1+i)%6);kind=queue[0];seen.clear();used=false;$('next').hidden=true;$('msg').textContent='Naciągnij kulę i puść. Moc: '+types[kind];let towers=2+Math.floor((level-1)/10);for(let j=0;j<towers;j++){let x=495+j*110,h=2+(level+j)%4;for(let i=0;i<h;i++){let y=460-i*52;for(let d of [0,52])blocks.push({x:x+d,y,w:14,h:40,mat:(level+i+j)%3,hp:material[(level+i+j)%3].hp,vx:0,vy:0});blocks.push({x:x-3,y:y-12,w:72,h:12,mat:(level+j)%3,hp:material[(level+j)%3].hp,vx:0,vy:0});}bots.push({x:x+33,y:433-(h-1)*52,r:14,alive:true,vy:0});bots.push({x:x+33,y:478,r:14,alive:true,vy:0})}update();tutorial()}
let arsenalCache='';function update(){$('hud').textContent='Poziom '+level+'/30 · '+score+' pkt · Pociski '+ammo+' · '+names[kind];if(arsenalCache===queue.join(','))return;arsenalCache=queue.join(',');$('arsenal').innerHTML='Arsenał: '+names.map((n,k)=>{let count=queue.filter(v=>v===k).length;return count?'<span style="display:inline-flex;align-items:center;gap:3px;margin:2px"><img style="width:38px;height:28px;object-fit:contain" src="assets/slingshot/'+n.toLowerCase()+'.png" alt="'+n+'">×'+count+'</span>':''}).join('')}
function pts(e){let r=c.getBoundingClientRect(),s=Math.min(r.width/960,r.height/540);return{x:(e.clientX-r.left-(r.width-960*s)/2)/s,y:(e.clientY-r.top-(r.height-540*s)/2)/s}}
c.onpointerdown=e=>{if(mode==='flight'){ability();return}if(mode!=='ready')return;let p=pts(e);if(Math.hypot(p.x-origin.x,p.y-origin.y)>90)return;c.setPointerCapture(e.pointerId);drag=p};c.onpointermove=e=>{if(drag){let p=pts(e),dx=p.x-origin.x,dy=p.y-origin.y,s=Math.min(1,115/(Math.hypot(dx,dy)||1));drag={x:origin.x+dx*s,y:origin.y+dy*s}}};c.onpointercancel=()=>drag=null;c.onpointerup=()=>{if(!drag)return;let vx=(origin.x-drag.x)*.19,vy=(origin.y-drag.y)*.19;drag=null;if(Math.hypot(vx,vy)<2)return;shots=[{x:origin.x,y:origin.y,vx,vy,r:15,kind}];ammo--;queue.shift();used=false;elapsed=0;mode='flight';beep(320);update()};
function blast(x,y,r){for(let b of blocks)if(b.hp>0&&Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y)<r){b.vx+=(b.x+b.w/2-x)/Math.max(1,material[b.mat].mass)*.12;b.vy-=4/material[b.mat].mass;b.hp-=2;if(b.hp<=0)score+=40}for(let b of bots)if(b.alive&&Math.hypot(b.x-x,b.y-y)<r){b.alive=false;score+=150}for(let i=0;i<25;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,t:35});beep(100);report()}
function ability(){if(mode!=='flight'||used||!shots.length)return;used=true;let p=shots[0];if(p.kind===1)blast(p.x,p.y,115);if(p.kind===2)shots.push({...p,vy:p.vy-5,r:10},{...p,vy:p.vy+5,r:10});if(p.kind===3){p.vx*=1.8;p.vy*=.6}if(p.kind===4){p.vx*=1.35;for(let b of blocks)if(b.hp>0&&Math.hypot(b.x-p.x,b.y-p.y)<100)b.vx+=Math.sign(p.vx)*5}if(p.kind===5){p.r=25;p.vx*=1.4}beep(850)}
function physicsStep(){if(mode==='flight'){elapsed++;for(let p of shots){p.vy+=.29;let steps=Math.max(1,Math.ceil(Math.hypot(p.vx,p.vy)/3));for(let i=0;i<steps;i++){let ox=p.x,oy=p.y;p.x+=p.vx/steps;p.y+=p.vy/steps;if(p.y+p.r>500){p.y=500-p.r;p.vy=-Math.abs(p.vy)*.3;p.vx*=.82}for(let b of blocks)if(b.hp>0&&p.x+p.r>b.x&&p.x-p.r<b.x+b.w&&p.y+p.r>b.y&&p.y-p.r<b.y+b.h){let speed=Math.hypot(p.vx,p.vy),m=material[b.mat].mass;let nx=0,ny=0;if(ox+p.r<=b.x)nx=-1;else if(ox-p.r>=b.x+b.w)nx=1;else if(oy+p.r<=b.y)ny=-1;else if(oy-p.r>=b.y+b.h)ny=1;else{let d=[p.x+p.r-b.x,b.x+b.w-p.x+p.r,p.y+p.r-b.y,b.y+b.h-p.y+p.r],j=d.indexOf(Math.min(...d));nx=[-1,1,0,0][j];ny=[0,0,-1,1][j]}let vn=p.vx*nx+p.vy*ny;if(nx)p.x=nx<0?b.x-p.r-.1:b.x+b.w+p.r+.1;if(ny)p.y=ny<0?b.y-p.r-.1:b.y+b.h+p.r+.1;if(vn<0){let impulse=-vn*(p.kind===5?2.4:1.2);b.vx-=nx*impulse/m*.65;b.vy-=ny*impulse/m*.5;p.vx-=nx*vn*1.22;p.vy-=ny*vn*1.22;if(speed>7){b.hp-=Math.floor(speed/8)+(p.kind===5?1:0);if(b.hp<=0){score+=40;for(let j=0;j<12;j++)particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*8,vy:-Math.random()*6,t:30})}beep(180)}}}for(let bot of bots)if(bot.alive&&Math.hypot(p.x-bot.x,p.y-bot.y)<p.r+bot.r){bot.alive=false;score+=150;p.vx*=.6;p.vy*=.6;report()}}}for(let b of blocks)if(b.hp>0){b.x+=b.vx;b.vx*=.94;for(let o of blocks)if(o!==b&&o.hp>0&&Math.abs(b.vx)>1.5&&b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y){o.vx+=b.vx*.45;b.vx*=.45}for(let bot of bots)if(bot.alive&&Math.hypot(b.vx,b.vy)>2&&bot.x+bot.r>b.x&&bot.x-bot.r<b.x+b.w&&bot.y+bot.r>b.y&&bot.y-bot.r<b.y+b.h){bot.alive=false;score+=150;beep(130);report()}}for(let b of blocks)if(b.hp>0&&b.y+b.h<500&&!blocks.some(o=>o!==b&&o.hp>0&&o.y>=b.y+b.h-2&&o.y<b.y+b.h+5&&o.x<b.x+b.w&&o.x+o.w>b.x)){b.vy+=.2;b.y+=b.vy;if(b.y+b.h>500){b.y=500-b.h;b.vy=0}}for(let b of bots)if(b.alive&&b.y+b.r<500&&!blocks.some(o=>o.hp>0&&o.y>=b.y+b.r-3&&o.y<b.y+b.r+5&&b.x>o.x&&b.x<o.x+o.w)){b.vy+=.3;b.y+=b.vy;if(b.y+b.r>=500){if(b.vy>6){b.alive=false;score+=150}b.y=500-b.r;b.vy=0}}if(!bots.some(b=>b.alive)){score+=ammo*50;mode='won';$('msg').textContent=level===30?'Ukończono wszystkie misje!':'Misja ukończona!';$('next').hidden=level===30;report()}else if(elapsed>330||shots.every(p=>p.x>1000||p.x<0||Math.hypot(p.vx,p.vy)<.8)){shots=[];kind=queue[0]??kind;mode=ammo?'ready':'lost';if(ammo)tutorial();$('msg').textContent=ammo?'Następny pocisk: '+types[kind]:'Koniec amunicji. Spróbuj ponownie.';report()}update()}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.t--}particles=particles.filter(p=>p.t>0)}
function unit(ctx,p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy||0,p.vx||1)*.35);let r=p.r;ctx.scale(r/15,r/15);if(pic(ctx,names[p.kind].toLowerCase(),-25,-19,50,38)){ctx.restore();return}let grad=ctx.createLinearGradient(-15,-15,15,15);grad.addColorStop(0,'#fff');grad.addColorStop(.32,colors[p.kind]);grad.addColorStop(1,'#102238');ctx.fillStyle=grad;ctx.strokeStyle='#a9eaff';ctx.lineWidth=1.4;ctx.beginPath();let shapes=[[[20,0],[-12,-14],[-6,0],[-12,14]],[[15,-12],[19,0],[15,12],[-14,12],[-19,0],[-14,-12]],[[20,0],[-6,-17],[-15,-9],[-8,0],[-15,9],[-6,17]],[[23,0],[-15,-10],[-5,0],[-15,10]],[[17,-14],[22,0],[17,14],[-15,6],[-15,-6]],[[17,-17],[21,0],[17,17],[-17,17],[-21,0],[-17,-17]]];shapes[p.kind].forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#071525';ctx.fillRect(0,-5,12,10);ctx.fillStyle='#9ffaff';ctx.fillRect(5,-3,5,6);ctx.restore()}function draw(){let bg=g.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#102c51');bg.addColorStop(1,'#0b1023');g.fillStyle=bg;g.fillRect(0,0,960,540);g.fillStyle='#c3eaff';g.shadowColor='#8adfff';g.shadowBlur=40;g.beginPath();g.arc(780,90,48,0,7);g.fill();g.shadowBlur=0;for(let i=0;i<65;i++){g.fillStyle='#a4dfff88';g.fillRect((i*137)%960,(i*79)%260,2,2)}for(let layer=0;layer<3;layer++){g.fillStyle=['#142c48','#1b4056','#24566a'][layer];g.beginPath();g.moveTo(0,500);for(let i=0;i<=12;i++)g.lineTo(i*85,280+layer*53-Math.sin(i*1.8+layer)*55);g.lineTo(960,500);g.fill()}g.fillStyle='#17394d';for(let i=0;i<12;i++){let y=350-i%3*36;g.fillRect(i*85,y,65,500-y);g.fillStyle='#50b7d744';for(let j=0;j<4;j++)g.fillRect(i*85+10,y+12+j*24,35,3);g.fillStyle='#17394d'}pic(g,['background','background_city','background_desert','background_ice','background_lava'][Math.floor((level-1)/6)%5],0,0,960,500);g.fillStyle='#31586a';g.fillRect(0,500,960,40);g.strokeStyle='#54d9ff';g.lineWidth=9;g.beginPath();g.moveTo(145,495);g.lineTo(145,410);g.lineTo(117,370);g.moveTo(145,410);g.lineTo(173,370);g.stroke();pic(g,'slingshot',65,350,150,150);for(let b of blocks)if(b.hp>0){let n=material[b.mat].name+(b.w>b.h&&b.mat!==1?'_beam':'_block');if(pic(g,n,b.x,b.y,b.w,b.h))continue;g.fillStyle=['','#c05238','#c68c4d','#8f9daf'][b.hp]||'#8f9daf';let grad=g.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);grad.addColorStop(0,g.fillStyle);grad.addColorStop(1,'#263749');g.fillStyle=grad;g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#ffffff44';g.fillRect(b.x+2,b.y+2,b.w-4,3);g.strokeStyle='#d5eaff';g.lineWidth=1;g.strokeRect(b.x,b.y,b.w,b.h);g.strokeStyle='#07152588';if(b.hp===1){for(let y=b.y+7;y<b.y+b.h;y+=7){g.beginPath();g.moveTo(b.x,y);g.lineTo(b.x+b.w,y);g.stroke()}}else if(b.hp===2){for(let x=b.x+4;x<b.x+b.w;x+=5){g.beginPath();g.moveTo(x,b.y);g.lineTo(x,b.y+b.h);g.stroke()}}else{g.fillStyle='#e2edf2';for(let y of [b.y+3,b.y+b.h-3]){g.beginPath();g.arc(b.x+3,y,1.5,0,7);g.fill()}}}for(let b of bots)if(b.alive){if(pic(g,'enemy_guard',b.x-19,b.y-23,38,38))continue;g.fillStyle='#ff557d';g.beginPath();g.roundRect(b.x-15,b.y-15,30,30,8);g.fill();g.fillStyle='#10233d';g.fillRect(b.x-11,b.y-6,22,10);g.fillStyle='#fff';g.fillRect(b.x-8,b.y-4,5,5);g.fillRect(b.x+3,b.y-4,5,5)}let list=mode==='ready'?[{...(drag||origin),r:15,kind}]:shots;if(drag){g.strokeStyle='#ffcb70';g.lineWidth=4;g.beginPath();g.moveTo(117,370);g.lineTo(drag.x,drag.y);g.lineTo(173,370);g.stroke();for(let t=3;t<42;t+=4){g.fillStyle='#fff9';g.beginPath();g.arc(origin.x+(origin.x-drag.x)*.19*t,origin.y+(origin.y-drag.y)*.19*t+.145*t*t,2,0,7);g.fill()}}for(let p of list)unit(g,p);for(let p of particles){g.fillStyle='#ffc65c';g.fillRect(p.x,p.y,4,4)}}
let last=0,acc=0;function tick(){if($('demo').style.display!=='flex')physicsStep()}function loop(t){acc+=Math.min(100,t-last||16);last=t;while(acc>=16.67){tick();acc-=16.67}draw();if($('demo').style.display==='flex'){let ctx=$('preview').getContext('2d'),t=(performance.now()%2400)/2400;ctx.clearRect(0,0,180,100);unit(ctx,{x:22+t*135,y:48-22*Math.sin(t*Math.PI),r:10,kind});pic(ctx,'wood_block',145,48,25,32);if(t>.72)pic(ctx,'explosion',126,25,50,50);if(kind===2&&t>.4){unit(ctx,{x:22+t*135,y:20,r:7,kind});unit(ctx,{x:22+t*135,y:75,r:7,kind})}}requestAnimationFrame(loop)}$('ability').onclick=ability;$('next').onclick=()=>{level++;build()};$('restart').onclick=()=>{report();score=0;level=1;build()};$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};$('exit').onclick=()=>{report();if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-slingshot-exit-fullscreen',game:'slingshot'}),location.origin);else location.href='/'};$('share').onclick=()=>{report();let u=new URL('/share-result.html',location.origin);u.searchParams.set('game','slingshot');u.searchParams.set('score',score);if(navigator.share)navigator.share({title:'Genesis Slingshot',text:score+' pkt',url:u.href}).catch(()=>{});else window.open(u.href,'_blank')};addEventListener('pagehide',report);build();requestAnimationFrame(loop);
