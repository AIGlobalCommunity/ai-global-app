<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genesis Duck Hunt</title><style>*{box-sizing:border-box}body{margin:0;background:#102e38;color:white;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none;cursor:crosshair}header{position:absolute;inset:12px 12px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}button{pointer-events:auto;background:#153d45;color:white;border:1px solid #bde5dc;border-radius:12px;padding:12px;font:inherit}#menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#102e38b0;padding:24px}#menu[hidden]{display:none}#exit{margin-left:auto}</style><canvas id="c"></canvas><header><strong id="hud"></strong><button id="exit">✕</button></header><section id="menu"><h1>GENESIS DUCK HUNT</h1><p id="msg">Klikaj lub dotykaj lecących kaczek. Masz 3 strzały na falę.</p><button id="start">Rozpocznij</button></section><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),menu=document.querySelector('#menu'),msg=document.querySelector('#msg');let w,h,ducks=[],score=0,level=1,ammo=3,miss=0,running=false,last=0,wait=0,best=0,audio;try{best=Number(localStorage.getItem('duck-best'))||0}catch{}
function resize(){w=c.clientWidth;h=c.clientHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const maps=['Łąka','Jezioro','Las','Bagna','Zachód słońca'];function report(){if(score<10)return;const data={type:'genesis-game-score',game:'duck',score,level,at:Date.now()};try{localStorage.setItem('agc-game-pending-duck',JSON.stringify(data));if(parent!==window)parent.postMessage(JSON.stringify(data),location.origin)}catch{}}function wave(){ammo=3;wait=0;ducks=Array.from({length:Math.min(3,1+Math.floor((level-1)/3))},(_,i)=>{let dir=Math.random()<.5?1:-1;let mode=(level+i)%4,origin=w*(.15+Math.random()*.7);return{mode,age:0,origin,x:mode===0?(dir===1?-50:w+50):origin,y:mode===0?h*(.22+Math.random()*.35):mode===1?h*.83:h*.48,dir,v:Math.min(440,95+level*18+i*15),phase:Math.random()*6,r:Math.max(25,Math.min(42,w*.075))}})}
function sound(hit){try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=hit?'triangle':'sawtooth';o.frequency.setValueAtTime(hit?650:100,audio.currentTime);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch{}}
function end(){report();running=false;best=Math.max(best,score);try{localStorage.setItem('duck-best',best)}catch{}msg.textContent='Wynik: '+score+' • Rekord lokalny: '+best;menu.hidden=false}
document.querySelector('#start').onclick=()=>{score=0;level=1;miss=0;running=true;menu.hidden=true;wave()};
document.querySelector('#exit').onclick=()=>{if(running)report();running=false;if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-duck-exit-fullscreen',game:'duck'}),location.origin);else if(document.fullscreenElement)document.exitFullscreen();menu.hidden=false};
c.addEventListener('pointerdown',e=>{if(!running||!ammo||!ducks.length)return;ammo--;let b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,i=ducks.findIndex(d=>Math.hypot(x-d.x,y-d.y)<d.r*1.25);sound(i>=0);if(i>=0){ducks.splice(i,1);score+=100*level}if(!ammo&&ducks.length){miss+=ducks.length;ducks=[]}});
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawDuck(d,t){ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.dir*d.r/30,d.r/30);ellipse(0,0,26,14,'#8b6650');ellipse(-8,-3,19,8+Math.abs(Math.sin(t*12+d.phase))*13,'#d4c3a2');ellipse(20,-12,11,12,'#17765e');ellipse(32,-10,8,4,'#f4bb45');ellipse(23,-15,2,2,'#101c23');ctx.restore()}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let sky=ctx.createLinearGradient(0,0,0,h);let map=Math.floor((level-1)/3)%5;sky.addColorStop(0,['#60b9e6','#4089c1','#326d70','#7a9390','#e17b54'][map]);sky.addColorStop(.75,['#d4f1db','#bce5f4','#a3c99b','#c6c5a0','#ffd098'][map]);sky.addColorStop(1,'#558b59');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){ellipse(i*w/6,h*.83,w*.2,h*.18,'#477e58')}ctx.fillStyle='#276c78';ctx.fillRect(0,h*.88,w,h*.12);if(running){for(let d of ducks){d.age+=dt;if(d.mode===0){d.x+=d.dir*d.v*dt;d.y+=Math.sin(t/250+d.phase)*35*dt}else if(d.mode===1){d.x+=d.dir*d.v*.65*dt;d.y-=d.v*.7*dt}else if(d.mode===2){d.x=d.origin+Math.sin(d.age*1.8)*w*.13;d.y=h*(.48-d.age*.07);d.r=Math.min(75,12+d.age*17)}else{d.x+=d.dir*d.v*.7*dt;d.y+=Math.cos(d.age*2)*d.v*.45*dt}}let old=ducks.length;ducks=ducks.filter(d=>d.age<5&&d.y>-65&&(d.dir===1?d.x<w+65:d.x>-65));miss+=old-ducks.length;if(miss>=5)end();else if(!ducks.length){wait+=dt;if(wait>.65){level++;wave()}}}for(let d of ducks)drawDuck(d,t/1000);hud.textContent=maps[map]+' | Punkty '+score+' | Poziom '+level+' | Strzały '+ammo+' | Uciekło '+miss+'/5';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
