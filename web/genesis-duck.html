<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genesis Duck Hunt</title><style>*{box-sizing:border-box}body{margin:0;background:#102e38;color:white;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none;cursor:crosshair}header{position:absolute;inset:12px 12px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}button{pointer-events:auto;background:#153d45;color:white;border:1px solid #bde5dc;border-radius:12px;padding:12px;font:inherit}#menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#102e38b0;padding:24px}#menu[hidden]{display:none}#exit{margin-left:auto}input{font:inherit;padding:10px;border-radius:8px;max-width:100%}#multi{position:absolute;inset:0;background:#102e38;overflow:auto;padding:24px;text-align:center}#multi[hidden]{display:none}#multi button{margin:4px}#qr{background:white;padding:12px;display:inline-block}#qr:empty{display:none}</style><canvas id="c"></canvas><header><strong id="hud"></strong><button id="exit">✕</button></header><section id="menu"><h1>GENESIS DUCK HUNT</h1><p id="msg">Klikaj lub dotykaj lecących kaczek. Masz 3 strzały na falę.</p><button id="start">Solo</button><button id="mp">Multiplayer 2–4</button></section><section id="multi" hidden><h1>DUCK HUNT MULTIPLAYER</h1><p id="status" role="status"></p><div id="players"></div><button id="create">Utwórz pokój</button><button id="inbox">Zaproszenia</button><div id="invites"></div><input id="nick" placeholder="Twój nick" maxlength="32"><label><input type="checkbox" id="rules"> Akceptuję zasady gry</label><button id="join">Dołącz</button><div id="host" hidden><input id="identity" placeholder="Nick lub e-mail"><button id="invite">Zaproś</button><button id="renew">Nowy link / QR</button><button id="revoke">Unieważnij link</button><p><input id="link" readonly><button id="copy">Kopiuj link</button></p><div id="qr"></div><button id="begin">Rozpocznij grę</button></div><button id="back">Wróć</button></section><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),menu=document.querySelector('#menu'),msg=document.querySelector('#msg');let w,h,ducks=[],score=0,level=1,ammo=3,miss=0,running=false,last=0,wait=0,best=0,audio;try{best=Number(localStorage.getItem('duck-best'))||0}catch{}
function resize(){w=c.clientWidth;h=c.clientHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function wave(){ammo=3;wait=0;ducks=Array.from({length:Math.min(3,1+Math.floor((level-1)/3))},(_,i)=>{let dir=Math.random()<.5?1:-1;return{x:dir===1?-50:w+50,y:h*(.22+Math.random()*.35),dir,v:Math.min(440,95+level*18+i*15),phase:Math.random()*6,r:Math.max(25,Math.min(42,w*.075))}})}
function sound(hit){try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=hit?'triangle':'sawtooth';o.frequency.setValueAtTime(hit?650:100,audio.currentTime);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch{}}
function end(){running=false;best=Math.max(best,score);try{localStorage.setItem('duck-best',best)}catch{}msg.textContent='Wynik: '+score+' • Rekord lokalny: '+best;menu.hidden=false}
document.querySelector('#start').onclick=()=>{score=0;level=1;miss=0;running=true;menu.hidden=true;wave()};
document.querySelector('#exit').onclick=()=>{running=false;if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-duck-exit-fullscreen',game:'duck'}),location.origin);else if(document.fullscreenElement)document.exitFullscreen();menu.hidden=false};
c.addEventListener('pointerdown',e=>{if(!running||!ammo||!ducks.length)return;ammo--;let b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,i=ducks.findIndex(d=>Math.hypot(x-d.x,y-d.y)<d.r*1.25);sound(i>=0);if(i>=0){ducks.splice(i,1);score+=100*level}if(!ammo&&ducks.length){miss+=ducks.length;ducks=[]}});
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawDuck(d,t){ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.dir*d.r/30,d.r/30);ellipse(0,0,26,14,'#8b6650');ellipse(-8,-3,19,8+Math.abs(Math.sin(t*12+d.phase))*13,'#d4c3a2');ellipse(20,-12,11,12,'#17765e');ellipse(32,-10,8,4,'#f4bb45');ellipse(23,-15,2,2,'#101c23');ctx.restore()}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#60b9e6');sky.addColorStop(.75,'#d4f1db');sky.addColorStop(1,'#558b59');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){ellipse(i*w/6,h*.83,w*.2,h*.18,'#477e58')}ctx.fillStyle='#276c78';ctx.fillRect(0,h*.88,w,h*.12);if(running){for(let d of ducks){d.x+=d.dir*d.v*dt;d.y+=Math.sin(t/250+d.phase)*35*dt}let old=ducks.length;ducks=ducks.filter(d=>d.dir===1?d.x<w+65:d.x>-65);miss+=old-ducks.length;if(miss>=5)end();else if(!ducks.length){wait+=dt;if(wait>.65){level++;wave()}}}for(let d of ducks)drawDuck(d,t/1000);hud.textContent='Punkty '+score+' | Poziom '+level+' | Strzały '+ammo+' | Uciekło '+miss+'/5';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script>
(()=>{const $=id=>document.getElementById(id);let room=null,session='',invite='',selected='',offset=0,pending=false,active=false;const params=new URLSearchParams(location.hash.slice(1));selected=params.get('room')||'';invite=params.get('invite')||'';const waits=new Map();
function status(s){$('status').textContent=s}
function call(action,data={}){return new Promise((resolve,reject)=>{if(parent===window){reject(Error('Otwórz grę w portalu The Genesis Era'));return}const request=crypto.randomUUID();waits.set(request,{resolve,reject});parent.postMessage(JSON.stringify({type:'genesis-duck-request',request,action,room:room?.id||selected,session,...data}),location.origin);setTimeout(()=>{if(waits.delete(request))reject(Error('Brak odpowiedzi serwera'))},12000)})}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch{return}if(d?.type!=='genesis-duck-result')return;const p=waits.get(d.request);if(!p)return;waits.delete(d.request);d.error?p.reject(Error(d.error)):p.resolve(d)});
function render(r){room=r;offset=r.serverTime-Date.now();$('players').textContent=r.players.map(p=>p.name+(p.guest?' (gość)':'')+': '+p.score).join(' • ')+' | '+r.players.length+'/4';$('host').hidden=!r.host||r.status!=='lobby';$('begin').disabled=r.players.length<2;$('create').hidden=true;$('join').hidden=true;if(r.status==='playing'){active=true;$('multi').hidden=true;menu.hidden=true}else{active=false;$('multi').hidden=false}}
function link(key){$('qr').replaceChildren();$('link').value=key?location.origin+'/genesis-duck.html#room='+encodeURIComponent(room.id)+'&invite='+encodeURIComponent(key):'';if(key&&window.QRCode)new QRCode($('qr'),{text:$('link').value,width:180,height:180});else if(key)status('Generator QR niedostępny; skopiuj link')}
async function act(a,d={}){try{const x=await call(a,d);if(x.session)session=x.session;if(x.room)render(x.room);if('invite'in x)link(x.invite);status('');return x}catch(e){status(e.message);return null}}
$('mp').onclick=()=>{running=false;menu.hidden=true;$('multi').hidden=false};$('create').onclick=()=>act('create');$('join').onclick=()=>act('join',{invite,nick:$('nick').value,rules:$('rules').checked});$('invite').onclick=async()=>{if(await act('invite',{identity:$('identity').value}))status('Zaproszenie wysłane')};$('renew').onclick=()=>act('renew');$('revoke').onclick=()=>act('revoke');$('begin').onclick=()=>act('start');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);status('Link skopiowany')}catch{$('link').select();status('Skopiuj zaznaczony link')}};$('back').onclick=()=>{room=null;active=false;$('multi').hidden=true;menu.hidden=false;$('create').hidden=false;$('join').hidden=false};$('inbox').onclick=async()=>{const x=await act('inbox');if(!x)return;$('invites').replaceChildren();for(const i of x.invites){const b=document.createElement('button');b.textContent='Dołącz do pokoju '+i.room_id.slice(0,8);b.onclick=()=>{selected=i.room_id;invite='';status('Podaj nick i kliknij Dołącz')};$('invites').append(b)}};
setInterval(async()=>{if(!room||pending)return;pending=true;try{const x=await call('state');render(x.room)}catch(e){status(e.message)}finally{pending=false}},700);
function targets(){if(!room)return[];const t=Date.now()+offset-room.start;return room.targets.filter(d=>!d.hit&&t>=d.at&&t<=d.at+d.duration).map(d=>({...d,x:(d.dir===1?(t-d.at)/d.duration:1-(t-d.at)/d.duration)*w,y:d.y*h,r:Math.max(25,Math.min(42,w*.075)),phase:d.id}))}
function draw(t){if(active){for(const d of targets())drawDuck(d,t/1000);hud.textContent=room.players.map(p=>p.name+' '+p.score).join(' | ');if(Date.now()+offset-room.start>92000){active=false;$('multi').hidden=false;status('Koniec rundy: '+$('players').textContent);room=null}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
c.addEventListener('pointerdown',async e=>{if(!active||pending)return;const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,d=targets().find(d=>Math.hypot(x-d.x,y-d.y)<d.r*1.25);if(!d)return;pending=true;try{const v=await call('hit',{target:d.id,x:x/w,y:y/h});render(v.room);sound(true)}catch{sound(false)}finally{pending=false}});
if(selected)$('mp').click();
})();
</script></html>
