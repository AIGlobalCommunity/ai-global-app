<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genesis Duck Hunt</title><style>*{box-sizing:border-box}body{margin:0;background:#102e38;color:white;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none;cursor:crosshair}header{position:absolute;inset:12px 12px auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}button{pointer-events:auto;background:#153d45;color:white;border:1px solid #bde5dc;border-radius:12px;padding:12px;font:inherit}#menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#102e38b0;padding:24px}#menu[hidden]{display:none}#exit{margin-left:auto}</style><canvas id="c"></canvas><header><strong id="hud"></strong><button id="exit">✕</button></header><section id="menu"><h1>GENESIS DUCK HUNT</h1><p id="msg">Klikaj lub dotykaj lecących kaczek. Masz 3 strzały na falę. Nie strzelaj do białych i szarych ptaków: tracisz życie i 100 punktów.</p><button id="start">Rozpocznij</button></section><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),hud=document.querySelector('#hud'),menu=document.querySelector('#menu'),msg=document.querySelector('#msg');let aim={x:0,y:0},flash=0,fx=[],fall=[],birds=[];let w,h,ducks=[],score=0,level=1,ammo=3,miss=0,running=false,last=0,wait=0,best=0,audio;try{best=Number(localStorage.getItem('duck-best'))||0}catch{}
function resize(){w=c.clientWidth;h=c.clientHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const maps=['Łąka','Jezioro','Las','Bagna','Zachód słońca'];function report(){if(score<10)return;const data={type:'genesis-game-score',game:'duck',score,level,at:Date.now()};try{const old=JSON.parse(localStorage.getItem('agc-game-pending-duck')||'null');if(!old||old.score<=score)localStorage.setItem('agc-game-pending-duck',JSON.stringify(data))}catch{}if(parent!==window)parent.postMessage(JSON.stringify(data),location.origin)}function wave(){ammo=3;wait=0;birds=level>=2?[{x:-60,y:h*.24,dir:1,r:30,v:110+level*9,phase:0,age:0,kind:level%2}]:[];ducks=Array.from({length:Math.min(3,1+Math.floor((level-1)/3))},(_,i)=>{let dir=Math.random()<.5?1:-1;let mode=(level+i)%4,origin=w*(.15+Math.random()*.7);return{mode,age:0,origin,x:mode===0?(dir===1?-50:w+50):origin,y:mode===0?h*(.22+Math.random()*.35):mode===1?h*.83:h*.48,dir,v:Math.min(440,95+level*18+i*15),phase:Math.random()*6,r:Math.max(25,Math.min(42,w*.075))}})}
function sound(hit){try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=hit?'triangle':'sawtooth';o.frequency.setValueAtTime(hit?650:100,audio.currentTime);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch{}}
function end(){report();running=false;best=Math.max(best,score);try{localStorage.setItem('duck-best',best)}catch{}msg.textContent='Wynik: '+score+' • Rekord lokalny: '+best;menu.hidden=false}
document.querySelector('#start').onclick=()=>{score=0;level=1;miss=0;fx=[];fall=[];flash=0;running=true;menu.hidden=true;wave()};
document.querySelector('#exit').onclick=()=>{if(running)report();running=false;if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-duck-exit-fullscreen',game:'duck'}),location.origin);else if(document.fullscreenElement)document.exitFullscreen();menu.hidden=false};
function point(e){const b=c.getBoundingClientRect();aim={x:e.clientX-b.left,y:e.clientY-b.top}}
c.addEventListener('pointermove',point);
c.addEventListener('pointerdown',e=>{point(e);if(!running||!ammo||!ducks.length)return;ammo--;flash=.18;const {x,y}=aim;let j=birds.findIndex(d=>Math.hypot(x-d.x,y-d.y)<d.r*1.2),i=ducks.findIndex(d=>Math.hypot(x-d.x,y-d.y)<d.r*1.25);
let label='PUDŁO',color='#fff';if(j>=0){birds.splice(j,1);score=Math.max(0,score-100);miss++;label='CHRONIONY PTAK −100 / −1 życie';color='#ff7777';sound(false)}else if(i>=0){const d=ducks.splice(i,1)[0];fall.push({...d,vy:-70,spin:0});score+=100*level;label='+'+100*level;color='#ffe37a';sound(true)}else sound(false);
fx.push({x,y,label,color,age:0});if(!ammo&&ducks.length){miss+=ducks.length;ducks=[]}});
function drawGun(){const x=w*.5,y=h+22,angle=Math.atan2(aim.x-x,y-(aim.y||h*.4));ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.translate(0,flash*70);ctx.fillStyle='#70462c';ctx.fillRect(-19,-70,38,85);ctx.fillStyle='#26343b';ctx.fillRect(-12,-145,24,90);ctx.fillStyle='#82949b';ctx.fillRect(-8,-145,5,80);ctx.fillRect(3,-145,5,80);if(flash>0){ctx.fillStyle='#ffdc65';ctx.beginPath();ctx.moveTo(-24,-145);ctx.lineTo(-8,-160);ctx.lineTo(0,-190);ctx.lineTo(10,-160);ctx.lineTo(25,-145);ctx.fill()}ctx.restore()}
function drawBird(d,t){ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.dir,1);ellipse(0,0,22,9,d.kind?'#9ca9b3':'#fff9e7');ellipse(-7,-4,19,4+Math.abs(Math.sin(t*9))*17,d.kind?'#657681':'#e1e7e9');ellipse(19,-6,7,7,'#f7f7ed');ellipse(27,-5,5,2,'#dfaa45');ctx.restore()}
function effects(dt,t){flash=Math.max(0,flash-dt);for(const d of fall){d.vy+=650*dt;d.y+=d.vy*dt;d.x+=d.dir*40*dt;d.spin+=dt*4;ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.spin);drawDuck({...d,x:0,y:0},t);ctx.restore()}fall=fall.filter(d=>d.y<h+70);for(const f of fx){f.age+=dt;ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,8+f.age*35,0,Math.PI*2);ctx.stroke();ctx.fillStyle=f.color;ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText(f.label,Math.max(105,Math.min(w-105,f.x)),f.y-20-f.age*35);ctx.restore()}fx=fx.filter(f=>f.age<1);if(running)drawGun()}
addEventListener('pagehide',()=>{if(running)report()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)report()});function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawDuck(d,t){ctx.save();ctx.translate(d.x,d.y);ctx.scale(d.dir*d.r/30,d.r/30);ellipse(0,0,26,14,'#8b6650');ellipse(-8,-3,19,8+Math.abs(Math.sin(t*12+d.phase))*13,'#d4c3a2');ellipse(20,-12,11,12,'#17765e');ellipse(32,-10,8,4,'#f4bb45');ellipse(23,-15,2,2,'#101c23');ctx.restore()}
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let sky=ctx.createLinearGradient(0,0,0,h);let map=Math.floor((level-1)/3)%5;sky.addColorStop(0,['#60b9e6','#4089c1','#326d70','#7a9390','#e17b54'][map]);sky.addColorStop(.75,['#d4f1db','#bce5f4','#a3c99b','#c6c5a0','#ffd098'][map]);sky.addColorStop(1,'#558b59');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){ellipse(i*w/6,h*.83,w*.2,h*.18,'#477e58')}ctx.fillStyle='#276c78';ctx.fillRect(0,h*.88,w,h*.12);if(running){for(const b of birds){b.x+=b.v*dt;b.y+=Math.sin(t/300)*20*dt}birds=birds.filter(b=>b.x<w+70);for(let d of ducks){d.age+=dt;if(d.mode===0){d.x+=d.dir*d.v*dt;d.y+=Math.sin(t/250+d.phase)*35*dt}else if(d.mode===1){d.x+=d.dir*d.v*.65*dt;d.y-=d.v*.7*dt}else if(d.mode===2){d.x=d.origin+Math.sin(d.age*1.8)*w*.13;d.y=h*(.48-d.age*.07);d.r=Math.min(75,12+d.age*17)}else{d.x+=d.dir*d.v*.7*dt;d.y+=Math.cos(d.age*2)*d.v*.45*dt}}let old=ducks.length;ducks=ducks.filter(d=>d.age<5&&d.y>-65&&(d.dir===1?d.x<w+65:d.x>-65));miss+=old-ducks.length;if(miss>=5)end();else if(!ducks.length){wait+=dt;if(wait>.65){level++;wave()}}}for(let d of ducks)drawDuck(d,t/1000);for(const b of birds)drawBird(b,t/1000);effects(dt,t/1000);hud.textContent=maps[map]+' | Punkty '+score+' | Poziom '+level+' | Strzały '+ammo+' | Życia '+Math.max(0,5-miss)+'/5';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
