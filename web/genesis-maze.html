<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GENESIS MAZE</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d1d;color:#e6f7ff;font:16px system-ui;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden;touch-action:none}header{width:min(95vw,620px);display:flex;justify-content:space-between;align-items:center;gap:5px;padding:8px}button{background:#132b49;color:#e4fbff;border:1px solid #51d5ed;border-radius:9px;padding:9px;font-weight:700;touch-action:none}canvas{min-height:0;max-width:96vw;max-height:65dvh;aspect-ratio:1;object-fit:contain}#info{font-size:13px;text-align:center;padding:5px}#pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px;margin:auto}#pad button{height:40px}#menu{position:fixed;inset:0;background:#050b18dd;display:grid;place-items:center;z-index:5}#panel{border:1px solid #4fe7ef;background:#10203b;padding:26px;border-radius:20px;text-align:center;width:min(90vw,420px)}h1{color:#70f5e7;letter-spacing:3px}#exit{position:relative;z-index:6}#rank{font-size:12px;color:#9bdbea}
body{background:radial-gradient(ellipse at top,#19385c,#070916 70%)}canvas{border:1px solid #4268a0;border-radius:14px;box-shadow:0 0 30px #3c8bdb44}header{background:#10213b;border-radius:12px;margin-top:5px}#panel{box-shadow:0 0 50px #46caff33}button{background:linear-gradient(#233e65,#10213b)}#legend{font-size:11px;text-align:center;color:#c3e7ff;padding:4px}</style><header><button id="exit">✕</button><b id="hud">LEVEL 1 · 0 PKT</b><button id="sound">🔊</button><button id="pause">Ⅱ</button><button id="share">↗</button></header><div id="info">Zbierz kryształy i unikaj strażników.</div><canvas id="c" width="630" height="630"></canvas><div id="legend">⚪ 10 · 🟡 50 · 🔴 +1 życie · 🔵 tarcza · 🟢 turbo · 🟣 ×2</div><div id="rank">Ranking: oczekiwanie na wynik</div><div id="pad"><span></span><button data-dir="0">▲</button><span></span><button data-dir="3">◀</button><button data-dir="2">▼</button><button data-dir="1">▶</button></div><div id="menu"><div id="panel"><h1>GENESIS MAZE</h1><p id="msg">Zbierz energię w labiryncie. Uciekaj przed robotami ochrony. Strzałki, WASD lub gesty.</p><button id="start">▶ ROZPOCZNIJ</button></div></div><script src="genesis-share-end.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),N=21,S=30,D=[[0,-1],[1,0],[0,1],[-1,0]];let map,items,player,bots,level=1,score=0,lives=3,power=0,shield=0,playing=false,paused=false,dir=1,desired=1,last=0,acc=0,audio=null,sound=true,seed=1,speedUntil=0,doubleUntil=0,powerUntil=0;const key=(x,y)=>y*N+x;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function free(x,y){return x>=0&&y>=0&&x<N&&y<N&&map[y][x]===0}function tone(f,d=.08){if(!audio||!sound)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function build(){seed=(level*1234567+42)>>>0;map=Array.from({length:N},()=>Array(N).fill(1));const stack=[[1,1]];map[1][1]=0;while(stack.length){const [x,y]=stack[stack.length-1],opts=D.map(([dx,dy])=>[x+dx*2,y+dy*2,dx,dy]).filter(([a,b])=>a>0&&b>0&&a<N-1&&b<N-1&&map[b][a]);if(!opts.length){stack.pop();continue}const [a,b,dx,dy]=opts[Math.floor(random()*opts.length)];map[y+dy][x+dx]=0;map[b][a]=0;stack.push([a,b])}for(let i=0;i<45;i++){let x=1+Math.floor(random()*(N-2)),y=1+Math.floor(random()*(N-2));if((x%2)!==(y%2))map[y][x]=0}items=new Map();for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(free(x,y)&&!(x===1&&y===1))items.set(key(x,y),1);for(const [x,y] of [[19,1],[1,19],[19,19],[9,9]])items.set(key(x,y),2);const slots=[...items.keys()].filter(k=>items.get(k)===1&&k>N*3);for(const type of [3,4,5,6,6,2]){const i=Math.floor(random()*slots.length);items.set(slots.splice(i,1)[0],type)}player={x:1,y:1};bots=Array.from({length:Math.min(6,2+Math.floor(level/2))},(_,i)=>({x:19-i*2,y:19,dir:0,kind:i%3}));power=0;powerUntil=speedUntil=doubleUntil=0;shield=12;dir=desired=1;hud()}
function hud(){$('hud').textContent='LV '+level+' · '+score+' PKT · ♥ '+lives;$('info').textContent='CEL: pozostało '+items.size+' kryształów'+(power?' · 🛡 '+Math.ceil(Math.max(0,powerUntil-performance.now())/1000)+'s':'')+(speedUntil>performance.now()?' · ⚡ SPEED':'')+(doubleUntil>performance.now()?' · ×2':'')}
function report(){if(score<10)return;const p={type:'genesis-game-score',game:'maze',score,level,at:Date.now()};try{const k='agc-game-pending-maze',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<=score)localStorage.setItem(k,JSON.stringify(p))}catch(e){}if(parent!==window){parent.postMessage(JSON.stringify(p),location.origin);$('rank').textContent='Ranking: wysyłanie…'}else $('rank').textContent='Rekord lokalny: '+score}
function nextStep(b,target){const q=[[b.x,b.y,-1]],seen=new Set([key(b.x,b.y)]);for(let j=0;j<q.length;j++){const [x,y,first]=q[j];if(x===target.x&&y===target.y)return first;for(let i=0;i<4;i++){const nx=x+D[i][0],ny=y+D[i][1],k=key(nx,ny);if(free(nx,ny)&&!seen.has(k)){seen.add(k);q.push([nx,ny,first<0?i:first])}}}return -1}
function move(p,d){if(d<0)return false;const [dx,dy]=D[d],x=p.x+dx,y=p.y+dy;if(!free(x,y))return false;p.x=x;p.y=y;return true}
function collide(){for(const b of bots)if(b.x===player.x&&b.y===player.y){if(power>0){score+=100;b.x=19;b.y=19;tone(700)}else if(shield===0){lives--;player.x=1;player.y=1;shield=15;tone(110,.3);if(!lives){playing=false;report();$('msg').textContent='Koniec! '+score+' pkt · level '+level;$('menu').style.display='grid';try{if(typeof genesisShowEndShare==='function')genesisShowEndShare('maze',score)}catch(e){}return}}}}
let ticks=0;function step(){ticks++;power=performance.now()<powerUntil?1:0;if(shield)shield--;if(move(player,desired))dir=desired;else move(player,dir);const k=key(player.x,player.y),v=items.get(k);if(v){items.delete(k);score+=(v===6?50:v===2?50:10)*(doubleUntil>performance.now()?2:1);if(v===2){powerUntil=performance.now()+10000;power=1;tone(520)}else if(v===3){lives++;tone(880,.2)}else if(v===4){speedUntil=performance.now()+8000;tone(660)}else if(v===5){doubleUntil=performance.now()+12000;tone(740)}else tone(260);if(ticks%5===0||v!==1)report()}collide();if(!playing)return;if(ticks%(level>=6?1:2)===0)for(const b of bots){const options=D.map((_,i)=>i).filter(i=>free(b.x+D[i][0],b.y+D[i][1]));let d=b.kind===2&&random()<.6?options[Math.floor(random()*options.length)]:nextStep(b,player);if(power)d=options[Math.floor(random()*options.length)];move(b,d??-1)}collide();if(!playing)return;if(!items.size){score+=level*250;level=Math.min(1000,level+1);report();build();tone(1000,.4)}hud()}
function draw(){ctx.fillStyle='#080f21';ctx.fillRect(0,0,630,630);for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(map[y][x]){ctx.fillStyle='#14264b';ctx.beginPath();ctx.roundRect(x*S+1,y*S+1,S-2,S-2,5);ctx.fill();ctx.strokeStyle='#376db0';ctx.stroke()}else if(items.has(key(x,y))){const v=items.get(key(x,y)),big=v!==1;ctx.save();ctx.fillStyle=['','#eafaff','#48bfff','#ff5478','#5cff9b','#bf75ff','#ffdc70'][v];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=big?14:5;ctx.beginPath();let cx=x*S+15,cy=y*S+15,r=big?8+Math.sin(performance.now()/180):3;ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.restore()}}for(const b of bots){ctx.fillStyle=power?'#777fa5':['#ff637c','#b880ff','#ffae55'][b.kind];ctx.fillRect(b.x*S+5,b.y*S+5,20,20);ctx.fillStyle='#050d1a';ctx.fillRect(b.x*S+9,b.y*S+10,12,5)}ctx.save();ctx.translate(player.x*S+15,player.y*S+15);ctx.rotate(dir*Math.PI/2);ctx.fillStyle=shield&&ticks%2?'#65a1b9':'#5de8ff';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(12,8);ctx.lineTo(0,4);ctx.lineTo(-12,8);ctx.closePath();ctx.fill();ctx.restore()}
function frame(t){let dt=Math.min(100,t-last);last=t;if(playing&&!paused){acc+=dt;let interval=Math.max(75,155-level*3)*(speedUntil>performance.now()?.65:1);while(acc>=interval&&playing){acc-=interval;step()}draw()}requestAnimationFrame(frame)}
$('start').onclick=()=>{try{if(typeof genesisHideEndShare==='function')genesisHideEndShare();audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}score=0;level=1;lives=3;paused=false;acc=0;build();playing=true;$('menu').style.display='none';draw()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};$('exit').onclick=()=>{report();if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-maze-exit-fullscreen',game:'maze'}),location.origin);else location.href='/'};$('share').onclick=()=>{report();try{if(typeof genesisShowEndShare==='function')genesisShowEndShare('maze',score)}catch(e){}};document.querySelectorAll('[data-dir]').forEach(b=>b.onpointerdown=()=>desired=Number(b.dataset.dir));addEventListener('keydown',e=>{const d={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3}[e.code];if(d!==undefined){e.preventDefault();desired=d}});let touch; c.onpointerdown=e=>{touch=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{if(!touch)return;const x=e.clientX-touch[0],y=e.clientY-touch[1];if(Math.max(Math.abs(x),Math.abs(y))>12)desired=Math.abs(x)>Math.abs(y)?x>0?1:3:y>0?2:0;touch=null};addEventListener('message',e=>{if(e.origin!==location.origin)return;try{const m=typeof e.data==='string'?JSON.parse(e.data):e.data;if(m.type==='genesis-score-status'&&m.game==='maze')$('rank').textContent='Ranking: '+(m.state==='saved'?'zapisano '+m.score+' pkt':m.detail||m.state)}catch(e){}});addEventListener('pagehide',report);build();draw();requestAnimationFrame(frame)})();
</script></html>
