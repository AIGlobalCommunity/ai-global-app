const cellNodes=[],slotNodes=[];let drag=null,dragRAF=0;
function makeBlock(colorId){const block=document.createElement('div');block.className='block';color(block,colorId);return block}
function makePiece(p,cellSize){
 const width=Math.max(...p.shape.map(v=>v[0]))+1,height=Math.max(...p.shape.map(v=>v[1]))+1;
 const grid=document.createElement('div');grid.className='piece';

 for(let yy=0;yy<height;yy++)for(let xx=0;xx<width;xx++){
  const block=makeBlock(p.color);
  if(!p.shape.some(([a,b])=>a===xx&&b===yy))block.style.visibility='hidden';
  grid.appendChild(block);
 }
 return grid;
}
function paintBoard(){
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const d=cellNodes[y*N+x],value=board[y][x];d.className='cell';
  if(value!==null){d.classList.add('filled');color(d,value);if(gems[y][x]!==null){d.classList.add('gem','gem-'+(gems[y][x]===0?'blue':gems[y][x]===1?'gold':'normal'))}}
 }

}
function paintPreview(){

}

 level++;missionStats={};missionStart=Date.now();combo=0;turn=0;ended=false;roundId++;
 for(const row of board)row.fill(null);for(const row of gems)row.fill(null);
 tray=[piece(),piece(),piece()];selected=-1;hover=null;seedStartingGems();
 $('overlay').classList.remove('show');paint();missionUI();saveCampaign();report();
 openLevelDialog(true);
}
function checkMission(){
 missionUI();
 if(progress()>=challenge().target){nextLevel();return true}
 saveCampaign();return false;
}
function missionTick(){
 if($('level-dialog').classList.contains('show')||ended)return;
 if(challenge().type==='survive')checkMission();
}
function report(){if(score<10)return;try{window.parent.postMessage(JSON.stringify({type:'genesis-game-score',game:'blocks',score,level}),location.origin)}catch(_){}}
function comboSound(level){
 if(!sound)return;activateAudio();
 [523,659,784,1047,1319].slice(0,Math.min(5,level+2)).forEach((f,i)=>setTimeout(()=>beep(f),i*75));
}
function sparkles(cells,intensity){
 const layer=$('fx-layer'),rect=$('board').getBoundingClientRect(),step=rect.width/N;
 const amount=Math.min(110,cells.length*(intensity>=3?6:4));
 for(let i=0;i<amount;i++){
  const [x,y]=cells[i%cells.length],p=document.createElement('i');
  p.className='particle';const sz=3+Math.random()*8;
  p.style.cssText='left:'+(rect.left+(x+.5)*step)+'px;top:'+(rect.top+(y+.5)*step)+'px;--sz:'+sz+'px;--pc:'+['#ffe57d','#70edff','#ff73cf','#a4ffb4'][i%4]+';--dx:'+(Math.random()-.5)*230+'px;--dy:'+(-35-Math.random()*190)+'px;--rot:'+(Math.random()*800-400)+'deg;--dur:'+(420+Math.random()*430)+'ms';
  layer.appendChild(p);setTimeout(()=>p.remove(),900);
 }
}
function comboBanner(lines,bonus){
 const el=$('combo-banner'),label=combo>=5?'🌟 LEGENDARY COMBO!':combo>=3?'🔥 MEGA COMBO!':combo>=2?'⚡ SUPER COMBO!':lines>=3?'💥 ULTRA BLAST!':lines===2?'✨ DOUBLE BLAST!':'💎 LINE CLEAR!';
 el.innerHTML=label+'<small>+'+bonus+' PKT · KOMBO ×'+combo+'</small>';
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
 clearTimeout(fxTimer);fxTimer=setTimeout(()=>el.classList.remove('show'),1100);
 if(combo>=2){$('app').classList.remove('shake');void $('app').offsetWidth;$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),350)}
}
function endGame(){if(ended)return;ended=true;report();genesisShowEndShare('blocks',score);
 $('result').textContent='BRAK DOSTĘPNYCH RUCHÓW';
 $('final-score').textContent=score+' PKT';
 $('final-combo').textContent='Najlepsze kombo: ×'+maxCombo+' · Rekord: '+best+' pkt';
 $('overlay').classList.add('show');saveCampaign();comboSound(Math.max(2,maxCombo));
}
function checkGameOver(){
 if(ended)return;
 if(!hasMove()){const thisRound=roundId;setTimeout(()=>{if(thisRound===roundId&&!hasMove())endGame()},460)}
}
function place(x,y){
 if(ended||selected<0||!tray[selected])return;
 const p=tray[selected];if(!valid(p,x,y)){beep(180);return}
 const beforeScore=score;const placed=p.shape.map(([dx,dy])=>[x+dx,y+dy]);
 for(const [cx,cy]of placed)board[cy][cx]=p.color;
 turn++;
 const rows=[],cols=[];
 for(let j=0;j<N;j++){if(board[j].every(v=>v!==null))rows.push(j);if(board.every(row=>row[j]!==null))cols.push(j)}
 const lines=rows.length+cols.length;
 const clearCells=[];
 if(lines){
  const unique=new Set();
  for(const j of rows)for(let xx=0;xx<N;xx++)unique.add(xx+','+j);
  for(const j of cols)for(let yy=0;yy<N;yy++)unique.add(j+','+yy);
  for(const cell of unique){const [cx,cy]=cell.split(',').map(Number);clearCells.push([cx,cy])}
  combo++;maxCombo=Math.max(maxCombo,combo);
  const bonus=lines*100+Math.max(0,lines-1)*75+Math.min(combo-1,10)*lines*65;
  score+=bonus;
  const collected=[];for(const [cx,cy]of clearCells){if(gems[cy][cx]!==null)collected.push(gems[cy][cx]);}
  const m=missionStats;m.crystals=(m.crystals||0)+collected.length;
  m.blue=(m.blue||0)+collected.filter(v=>v===0).length;
  m.gold=(m.gold||0)+collected.filter(v=>v===1).length;
  m.colors=Array.from(new Set([...(m.colors||[]),...collected]));
  sparkles(clearCells,combo);comboBanner(lines,bonus);comboSound(combo);
  for(const j of rows){board[j].fill(null);gems[j].fill(null)}
  for(const j of cols)for(let yy=0;yy<N;yy++){board[yy][j]=null;gems[yy][j]=null}
 }else{combo=0;beep(420)}
 if(score>best){best=score;try{localStorage.setItem('genesis-blocks-best',String(best))}catch(_){}}
 tray[selected]=null;selected=-1;hover=null;
 if(challenge().type==='regen'){if(lines)refillGemsAfterClear()}else seedGems();
 if(tray.every(v=>!v))tray=[piece(),piece(),piece()];
 paint();if(lines){for(const [cx,cy]of clearCells){const d=cellNodes[cy*N+cx];d.classList.add('burst');setTimeout(()=>d.classList.remove('burst'),330)}}$('combo-status').textContent=combo>=2?'🔥 KOMBO ×'+combo+' · REKORD KOMBO ×'+maxCombo:combo===1?'✨ LINIA! Kolejna linia = SUPER KOMBO':'';
 if(lines){for(const [cx,cy]of placed)if(board[cy][cx]!==null){const d=cellNodes[cy*N+cx];d.classList.add('just-placed');setTimeout(()=>d.classList.remove('just-placed'),210)}}
 const m=missionStats;m.pieces=(m.pieces||0)+1;
 m.lines=(m.lines||0)+lines;m.clears=(m.clears||0)+(lines>0?1:0);
 m.multilines=(m.multilines||0)+(lines>=2?1:0);m.singles=(m.singles||0)+(p.shape.length===1?1:0);
 m.large=(m.large||0)+(p.shape.length>=4?1:0);m.combo=Math.max(m.combo||0,combo);
 m.score=(m.score||0)+(score-beforeScore);
 report();if(!checkMission())checkGameOver();
}
function pos(e){const r=$('board').getBoundingClientRect(),style=getComputedStyle($('board')),pad=parseFloat(style.paddingLeft)||0,border=parseFloat(style.borderLeftWidth)||0,gap=parseFloat(style.columnGap)||3,edge=pad+border,cell=(r.width-2*edge-7*gap)/8,step=cell+gap;return {x:Math.floor((e.clientX-r.left-edge)/step),y:Math.floor((e.clientY-r.top-edge)/step)}}
function insideBoard(x,y){const r=$('board').getBoundingClientRect();return x>=r.left&&x<r.right&&y>=r.top&&y<r.bottom}
function dragPosition(x,y){
 if(!drag)return;
 drag.x=x;drag.y=y;
 if(dragRAF)return;
 dragRAF=requestAnimationFrame(()=>{
  dragRAF=0;if(!drag)return;
  const g=$('drag-ghost');g.style.transform='translate3d('+(drag.x-drag.offsetX)+'px,'+(drag.y-drag.offsetY)+'px,0)';
  const next=insideBoard(drag.x-drag.offsetX+drag.cell/2,drag.y-drag.offsetY+drag.cell/2)?pos({clientX:drag.x-drag.offsetX+drag.cell/2,clientY:drag.y-drag.offsetY+drag.cell/2}):null;
  if((!next)!==(!hover)||next&&(hover?.x!==next.x||hover?.y!==next.y)){hover=next;paintPreview()}
 });
}
$('tray').addEventListener('pointerdown',e=>{
 const slot=e.target.closest('[data-slot]');if(!slot)return;
 const index=Number(slot.dataset.slot),p=tray[index];if(!p)return;
 e.preventDefault();activateAudio();selected=index;hover=null;
 const g=$('drag-ghost'),boardRect=$('board').getBoundingClientRect();
 const computed=getComputedStyle($('board')),edge=(parseFloat(computed.paddingLeft)||0)+(parseFloat(computed.borderLeftWidth)||0),gap=parseFloat(computed.columnGap)||3;
 const size=(boardRect.width-2*edge-7*gap)/8;
 g.style.setProperty('--drag-cell',size+'px');g.replaceChildren(makePiece(p,'var(--drag-cell)'));
 g.classList.add('visible');g.style.gap='3px';
 const w=(Math.max(...p.shape.map(v=>v[0]))+1)*size;
 const h=(Math.max(...p.shape.map(v=>v[1]))+1)*size;
 drag={index,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,offsetX:w/2,offsetY:h/2,cell:size};
 dragPosition(e.clientX,e.clientY);paintTray();
});
document.addEventListener('pointermove',e=>{if(drag){e.preventDefault();dragPosition(e.clientX,e.clientY)}},{passive:false});
function finishDrag(e){
 if(!drag)return;
 const index=drag.index,wasTap=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<12;
 const anchorX=e.clientX-drag.offsetX+drag.cell/2,anchorY=e.clientY-drag.offsetY+drag.cell/2;
 const target=insideBoard(anchorX,anchorY)?pos({clientX:anchorX,clientY:anchorY}):null;
 drag=null;$('drag-ghost').classList.remove('visible');
 if(dragRAF){cancelAnimationFrame(dragRAF);dragRAF=0}
 hover=null;
 if(target&&tray[index]&&valid(tray[index],target.x,target.y)){
  selected=index;place(target.x,target.y);
 }else{
  // A tap selects the piece; an invalid drag returns it to the tray.
  selected=wasTap?index:-1;paintPreview();paintTray();if(target&&!wasTap)beep(180);
 }
}
document.addEventListener('pointerup',finishDrag);
document.addEventListener('pointercancel',e=>{if(!drag)return;drag=null;$('drag-ghost').classList.remove('visible');selected=-1;hover=null;paintPreview();paintTray()});
$('board').addEventListener('pointerdown',e=>{
 if(drag)return;
 const p=pos(e);if(selected>=0)place(p.x,p.y);
});
$('board').addEventListener('pointermove',e=>{
 if(drag||selected<0)return;
 const p=pos(e);if(!hover||p.x!==hover.x||p.y!==hover.y){hover=p;paintPreview()}
});
$('board').addEventListener('pointerleave',()=>{if(drag)return;hover=null;paintPreview()});
$('exit').onclick=()=>{try{window.parent.postMessage(JSON.stringify({type:'genesis-blocks-exit-fullscreen',game:'blocks'}),location.origin)}catch(_){}};
$('ranking').onclick=()=>{try{window.parent.postMessage(JSON.stringify({type:'genesis-open-ranking',game:'blocks'}),location.origin)}catch(_){}};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;try{const msg=typeof e.data==='string'?JSON.parse(e.data):e.data;if(msg?.type==='genesis-score-status'&&msg.game==='blocks'){$('hint').textContent=msg.state==='saved'?'🏆 Wynik '+msg.score+' pkt zapisany online':msg.state==='error'?'⚠ Błąd rankingu: '+String(msg.detail||'').slice(0,95):'⏳ Trwa zapis wyniku online';}}catch(_){}});
function reset(newCampaign=false){if(newCampaign){level=1;missionStats={};missionStart=Date.now()}else{missionStats={};missionStart=Date.now()}roundId++;ended=false;combo=0;maxCombo=0;turn=0;clearTimeout(fxTimer);$('combo-banner').classList.remove('show');$('combo-status').textContent='';$('fx-layer').replaceChildren();drag=null;$('drag-ghost').classList.remove('visible');for(const row of board)row.fill(null);for(const row of gems)row.fill(null);score=0;selected=-1;hover=null;tray=[piece(),piece(),piece()];seedStartingGems();$('overlay').classList.remove('show');paint();missionUI();saveCampaign();checkGameOver()}$('reset').onclick=()=>{GcoLives.reset();reset(true)};$('again').onclick=()=>GcoLives.lost(()=>{const saved=score;reset(false);score=saved;paint();saveCampaign()});$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫ DŹWIĘK: WŁ.':'♫ DŹWIĘK: WYŁ.'};$('music').onclick=()=>{activateAudio();music=!music;$('music').textContent=music?'♪ MUZYKA: WŁ.':'♪ MUZYKA: WYŁ.'};$('level-continue').onclick=()=>{$('level-dialog').classList.remove('show');checkGameOver()};$('level-restart').onclick=()=>{$('level-dialog').classList.remove('show');reset(true)};
if(restoreCampaign()){paint();missionUI();if(ended){reset(true)}else{openLevelDialog(false)}}else reset(true);
missionClock=setInterval(missionTick,1000);
})();
if (window.parent !== window && new URLSearchParams(location.search).has('embed')) {
  const closeButton = document.getElementById('exit');
  closeButton.setAttribute('aria-label', 'Zamknij grę');
  closeButton.title = 'Zamknij grę';
  closeButton.textContent = '×';
  closeButton.classList.add('genesis-close-game');
  document.body.appendChild(closeButton);
}
</script></body></html>
