<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Cyber Operations</title><link rel="stylesheet" href="./genesis-cyber-war.css?v=2035r16"></head><body><main><header><a href="/" target="_top">← The Genesis Era</a><div class="eyebrow">TACTICAL COMMAND INTERFACE // 2035 · UI R16</div><h1>Genesis Cyber War 2035</h1><div class="hud"><span>ISOLATED TRAINING ENVIRONMENT</span><strong id="balance">—</strong><button id="refresh">↻ Odśwież</button></div><p id="msg" role="status"></p></header><section><h2>MISSION CONTROL // WYBÓR OPERACJI</h2><p>10 misji bezpłatnych · kolejne 10 GCO · ponowne próby bez opłat</p><div class="mode-nav"><button id="campaign" class="active">Kampania fabularna</button><button id="arena">CTF Arena</button><strong id="points"></strong></div><div id="progress-dashboard"></div><div id="categories" hidden></div><div id="specialist-workbench" hidden></div><div id="campaign-map"></div><div id="missions"></div></section><section id="lab" hidden><div class="lab-heading"><h2 id="title"></h2><div id="mission-difficulty" class="mission-difficulty" hidden></div></div><p id="brief"></p><div id="op01-briefing" hidden></div><div id="op02-briefing" hidden></div><div id="op0304" hidden></div><div id="op0506" hidden></div><div id="op0708" hidden></div><div class="work"><aside><h3>NETWORK TOPOLOGY</h3><p id="session"></p><div id="nodes"></div></aside><article><h3>GENESIS SHELL / SECURE SESSION</h3><div id="output" role="log"></div><form id="cmdform"><span id="prompt"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Polecenie"><button>ENTER</button></form><div id="quick"></div></article></div><label>FLAG <input id="answer" placeholder="GENESIS{...}" autocomplete="off"></label> <button id="submit">VERIFY FLAG</button><div style="margin-top:12px"><button id="hint">Podpowiedź (−200 pkt)</button> <button id="review">Omów rozwiązanie</button><pre id="helpText" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div></section></main><script defer src="./genesis-cyber-war-visual.js?v=2035r16"></script><script defer src="./genesis-cyber-workbench.js?v=2035r16"></script><script defer src="./genesis-cyber-campaign.js?v=2035r16"></script><script>
const $=id=>document.getElementById(id);let arenaMode=false;let testerMode=false;let availableMissions=8;const categories=['Cryptography','Web Security','Digital Forensics','Blue Team','Network Security','Reverse Engineering','OSINT','Steganography','AI Security','Linux Security'];
const names=['Hex Protocol / Fractured Signal','Ghost Transmission','Reverse Signal','Cipher Labyrinth','Silent Intruder','Digital Evidence','Network Anomaly','Configuration Audit','Classified Report','Fragmented Signal'];
const tasks=['Odczytaj HEX','Odczytaj Base64','Odwróć ciąg znaków','Odczytaj HEX, następnie odwróć tekst','Znajdź potwierdzony incydent w logach','Odczytaj dowód z JSON','Znajdź odrzucony pakiet w CSV','Sprawdź sekcję incident','Odczytaj dowód z XML','Połącz fragmenty według sequence'];
const artifacts=['payload.hex','message.b64','reverse.txt','layered.hex','security.log','report.json','traffic.csv','service.ini','report.xml','fragments.txt'];
const hosts=['gateway','soc','archive','vault','workstation'];let lab=null,host='gateway',cwd='/',seen=new Set(),history=[],pos=0,busy=false,progress=[];
function token(){for(const k of ['sb-gjnddmurmegbklvedhnp-auth-token','supabase.auth.token'])try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v?.access_token||v?.currentSession?.access_token)return v.access_token||v.currentSession.access_token}catch{}return null}
async function rpc(action,m=1,answer=''){const t=token();if(!t)throw Error('Zaloguj się w zakładce Konto, a następnie wróć do gry.');const r=await fetch('https://gjnddmurmegbklvedhnp.supabase.co/rest/v1/rpc/'+(arenaMode?'agc_ctf_arena':'agc_ctf'),{method:'POST',headers:{apikey:'sb_publishable_Ty3Beae5ztODv0MM3Z_HDA_WEGwOyLP',Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_mission:m,p_answer:answer})});const d=await r.json();if(!r.ok)throw Error(d.message||'Błąd serwera');return d}
function out(t){const e=$('output');e.textContent+=String(t)+'\n';if(e.textContent.length>40000)e.textContent=e.textContent.slice(-35000);e.scrollTop=e.scrollHeight}
function target(){return ['archive','vault','workstation','archive','soc','vault','soc','gateway','archive','workstation'][lab.mode]}
let op02=null;function setupOp02(v){const bytes=new TextEncoder(),ids=Array.from({length:5},()=>crypto.randomUUID().slice(0,8)),valid=crypto.getRandomValues(new Uint32Array(1))[0]%5;const records=ids.map((id,i)=>({id,payload:i===valid?String(v.clue):btoa('TRAINING DECOY '+id+' '+('X'.repeat(i*7)))}));op02={records,valid,hash:null};const current=op02;crypto.subtle.digest('SHA-256',bytes.encode(records[valid].payload)).then(b=>{current.hash=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}).catch(()=>{current.hash='SHA-256 unavailable'});document.dispatchEvent(new CustomEvent('genesis:op02',{detail:{records:records.map(x=>({id:x.id,bytes:bytes.encode(x.payload).length}))}}))}function fs(){const files={'/README.txt':'Isolated Genesis training environment. Use help, scan, connect, ls, cd, cat.','/etc/hostname':host,'/logs/system.log':'INFO boot complete\nINFO network isolated\nINFO training session '+lab.mission};if(host==='soc')files['/logs/audit.log']='NOTICE evidence stored on '+target()+':/evidence/'+artifacts[lab.mode];if(host===target()&&!globalThis.GenesisFragments?.active()&&!(op02&&!arenaMode&&Number(lab.mission)===2)&&!globalThis.GenesisEvidence?.active()&&!globalThis.GenesisAdvanced?.active())files['/evidence/'+artifacts[lab.mode]]=lab.clue;if(op02&&!arenaMode&&Number(lab.mission)===2){const a=op02.records[op02.valid];if(host==='gateway')files['/logs/transmissions.log']=op02.records.map(x=>x.id+' '+(x===a?'ACCEPTED':'REJECTED')).join('\n');if(host==='soc'){files['/logs/audit.log']='Signal evidence: vault:/signals/ ; manifest: /evidence/manifest.txt';files['/evidence/manifest.txt']='Accepted ID: '+a.id+'\nSHA-256: '+(op02.hash||'Computing; retry')+'\nEncoding: Base64'}if(host==='vault')for(const x of op02.records)files['/signals/'+x.id+'.b64']=x.payload;}if(lab.mission===1&&!arenaMode){if(host==='gateway')files['/logs/transfer.log']='08:01 gateway → archive | accepted | evidence transfer\n08:02 gateway → vault | rejected | duplicate';if(host==='soc')files['/evidence/manifest.txt']='Accepted evidence: archive:/evidence/payload.hex\nEncoding: hexadecimal bytes\nValidation: decoded text must match GENESIS{...}';if(host==='vault')files['/evidence/duplicate.hex']='4445434f59';}if(globalThis.GenesisFragments?.active()){Object.assign(files,GenesisFragments.getFiles(host));if(host==='soc')files['/logs/audit.log']='Capture reconstruction: inspect capture log and sequence manifest.';}if(globalThis.GenesisEvidence?.active()){Object.assign(files,GenesisEvidence.getFiles(host));if(host==='soc')files['/logs/audit.log']='Open /evidence/case.txt; correlate logs and evidence references.'}if(globalThis.GenesisAdvanced?.active()){Object.assign(files,GenesisAdvanced.getFiles(host));if(host==='soc')files['/logs/audit.log']='Review specialist evidence and policy inventory, not generic mission files.'}return files}
function resolve(p){const parts=(p.startsWith('/')?p:cwd+'/'+p).split('/'),a=[];for(const x of parts){if(x==='..')a.pop();else if(x&&x!=='.')a.push(x)}return '/'+a.join('/')}
function listing(p){const prefix=p==='/'?'/':p+'/';return [...new Set(Object.keys(fs()).filter(k=>k.startsWith(prefix)).map(k=>{const x=k.slice(prefix.length);return x.includes('/')?x.split('/')[0]+'/':x}))]}
function draw(){ $('prompt').textContent='operator@'+host+':'+cwd+' $';$('nodes').replaceChildren();hosts.forEach((h,i)=>{const b=document.createElement('button');b.disabled=!seen.has(h);b.className=h===host?'active':'';b.textContent=seen.has(h)?h.toUpperCase()+' · 192.0.2.'+(i+1):'UNKNOWN NODE';b.onclick=()=>command('connect '+h);$('nodes').append(b)});$('session').textContent=seen.size+'/'+hosts.length+' węzłów · '+host}
function command(raw){if(!lab)return;const cmd=raw.trim().slice(0,2048);if(!cmd)return;if(op02&&!arenaMode&&Number(lab.mission)===2)document.dispatchEvent(new CustomEvent('genesis:op02-command',{detail:{}}));globalThis.GenesisFragments?.track();history.push(cmd);pos=history.length;out($('prompt').textContent+' '+cmd);const [op,...args]=cmd.split(/\s+/),arg=args.join(' ');try{const files=fs();const read=p=>{const k=resolve(p);if(!Object.prototype.hasOwnProperty.call(files,k))throw Error('Nie znaleziono pliku: '+k);globalThis.GenesisFragments?.track(host+':'+k);return files[k]};switch(op){
case 'help':out('joinfiles FILE... | decodefile base64 FILE | stat FILE | wc FILE | sha256sum FILE | scan | connect HOST | disconnect | pwd | whoami | hostname | ls [PATH] | cd PATH | cat FILE | grep TEXT FILE | head FILE | tail FILE | sort FILE | file FILE | decode hex DATA | decode base64 DATA | reverse DATA | clear');break;
case 'scan':hosts.forEach((h,i)=>{seen.add(h);out('192.0.2.'+(i+1)+'  '+h+'  ONLINE')});draw();break;
case 'connect':if(!seen.has(arg))throw Error('Nieodkryty host');host=arg;cwd='/';draw();break;
case 'disconnect':host='gateway';cwd='/';draw();break;
case 'pwd':out(cwd);break;case 'whoami':out('operator');break;case 'hostname':out(host);break;
case 'ls':out(listing(resolve(arg||'.')).join('  ')||'(pusty lub nieistniejący katalog)');break;
case 'cd':{const p=resolve(arg||'/');if(p!=='/'&&!listing(p).length)throw Error('Nie istnieje katalog');cwd=p;draw();break}
case 'cat':out(read(arg));if(op02)document.dispatchEvent(new CustomEvent('genesis:op02-command',{detail:{file:host+':'+resolve(arg)}}));break;case 'joinfiles':out(args.map(read).join(''));break;case 'decodefile':{const kind=args.shift();if(kind!=='base64')throw Error('Usage: decodefile base64 FILE');out(new TextDecoder().decode(Uint8Array.from(atob(read(args.join(' ')).trim()),x=>x.charCodeAt(0))));break}case 'stat':{const v=read(arg);out('File: '+resolve(arg)+' | Bytes: '+new TextEncoder().encode(v).length);break}case 'wc':{const v=read(arg);out(v.split('\n').length+' lines | '+new TextEncoder().encode(v).length+' bytes');break}case 'sha256sum':{const v=read(arg);crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(b=>out(Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')+'  '+arg)).catch(()=>out('SHA-256 unavailable'));break}
case 'grep':{const needle=args.shift();out(read(args.join(' ')).split('\n').filter(x=>x.includes(needle)).join('\n')||'Brak dopasowań');break}
case 'head':out(read(arg).split('\n').slice(0,5).join('\n'));break;
case 'tail':out(read(arg).split('\n').slice(-5).join('\n'));break;
case 'sort':out(read(arg).split('\n').sort().join('\n'));break;
case 'file':read(arg);out('Text artifact: '+arg);break;
case 'decode':{const kind=args.shift(),data=args.join(' ');if(kind==='hex'){if(!/^(?:[0-9a-f]{2})+$/i.test(data))throw Error('Invalid HEX');out(new TextDecoder().decode(Uint8Array.from(data.match(/../g),x=>parseInt(x,16))))}else if(kind==='base64')out(new TextDecoder().decode(Uint8Array.from(atob(data),x=>x.charCodeAt(0))));else throw Error('Unknown encoding');break}
case 'reverse':out(Array.from(arg).reverse().join(''));break;
case 'clear':$('output').textContent='';break;default:out('Unknown command. Type help.');
}}catch(e){out('ERROR: '+e.message)}}
function init(v){$('helpText').textContent='';lab=v;op02=null;globalThis.GenesisFragments?.stop();globalThis.GenesisEvidence?.stop();globalThis.GenesisAdvanced?.stop();host='gateway';cwd='/';seen=new Set(['gateway']);history=[];pos=0;$('lab').hidden=false;$('title').textContent='OP '+String(v.mission).padStart(2,'0')+' / '+names[v.mode];const difficulty=arenaMode?null:({1:4,2:6,3:7,4:8,5:7,6:8,7:7,8:8})[v.mission];$('mission-difficulty').hidden=!difficulty;$('mission-difficulty').textContent=difficulty?'TRUDNOŚĆ '+difficulty+'/10 · '+(difficulty>=7?'ZAAWANSOWANY':difficulty>=5?'ŚREDNIOZAAWANSOWANY':'PODSTAWOWY'):'';$('mission-difficulty').dataset.level=String(difficulty||0);$('brief').textContent=tasks[v.mode]+' • Odkryj sieć i sprawdź /logs/audit.log na SOC.';$('output').textContent='';$('answer').value='';out('GENESIS OS 2035 | TRAINING SHELL | type help');draw();document.dispatchEvent(new CustomEvent('genesis:mission',{detail:{mission:v.mission,arena:arenaMode}}));if(!arenaMode&&Number(v.mission)===1)$('brief').textContent='Odzyskaj wiarygodny materiał z przechwyconej transmisji.';if(!arenaMode&&Number(v.mission)===2){$('brief').textContent='Odprawa: ustal autentyczną transmisję, sprawdź integralność i odzyskaj flagę.';setupOp02(v)}if(!arenaMode&&[3,4].includes(Number(v.mission))){$('brief').textContent='Odprawa: odtwórz wiarygodny materiał i odzyskaj flagę.';GenesisFragments.start(Number(v.mission),v.clue)}if(!arenaMode&&[5,6].includes(Number(v.mission))){$('brief').textContent=Number(v.mission)===5?'Skoreluj syntetyczne alerty SOC, odróżnij szum od incydentu i odzyskaj dowód.':'Sprawdź integralność i pochodzenie materiałów w izolowanym repozytorium dowodów.';GenesisEvidence.start(Number(v.mission),v.clue)}if(!arenaMode&&[7,8].includes(Number(v.mission))){$('brief').textContent=Number(v.mission)===7?'Przeanalizuj anomalie fikcyjnej sieci i odtwórz powiązaną transmisję.':'Porównaj polityki z konfiguracją fikcyjnego systemu Linux i odzyskaj materiał.';GenesisAdvanced.start(Number(v.mission),v.clue)}$('lab').scrollIntoView({behavior:'smooth'})}
async function run(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message}finally{busy=false}}
function publishProgress(detail){window.genesisProgressSnapshot=detail;document.dispatchEvent(new CustomEvent('genesis:progress',{detail}));}
async function refresh(){publishProgress({loaded:false,arena:arenaMode});const d=await rpc('status');testerMode=!!d.tester;availableMissions=Number(d.available_missions)||8;$('hint').textContent=testerMode?'Podpowiedź (bezpłatna)':'Podpowiedź (−200 pkt)';$('review').textContent=testerMode?'Omówienie (bezpłatne)':'Omów rozwiązanie';const score=await helpRpc('status',1).catch(()=>({points:null}));$('points').textContent=(testerMode?'🧪 TESTER · ':'')+(score.points==null?'— pkt':score.points+' pkt');progress=d.missions;$('balance').textContent=d.balance+' GCO';$('missions').replaceChildren();for(let i=1;i<=availableMissions;i++){const p=progress.find(x=>x.mission===i),b=document.createElement('button');b.dataset.state=p?.solved?'solved':p?'ready':(!testerMode&&i>1&&!progress.some(x=>x.mission===i-1&&x.solved))?'locked':'ready';b.textContent=String(i).padStart(2,'0')+' · '+names[(i-1)%10]+' · '+(p?.solved?'✓':p?'OPEN':testerMode?'TEST':'FREE');b.disabled=b.dataset.state==='locked';b.onclick=()=>run(async()=>{if(!p&&i>10&&!testerMode&&!confirm('Odblokować za 10 GCO?'))return;init(await rpc(p?'open':'unlock',i));await refresh()});$('missions').append(b)}publishProgress({loaded:true,arena:arenaMode,missions:progress,points:score.points,total:availableMissions,tester:testerMode})}
$('cmdform').onsubmit=e=>{e.preventDefault();command($('cmd').value);$('cmd').value='';$('cmd').focus()};
$('cmd').onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();pos=Math.max(0,Math.min(history.length,pos+(e.key==='ArrowUp'?-1:1)));$('cmd').value=history[pos]||''}};
$('submit').onclick=()=>run(async()=>{if(!lab)return;const v=await rpc('submit',lab.mission,$('answer').value);$('msg').textContent=v.solved?'MISJA UKOŃCZONA':'Niepoprawna flaga';await refresh()});

async function helpRpc(action,m){const t=token();if(!t)throw Error('Zaloguj się');const r=await fetch('https://gjnddmurmegbklvedhnp.supabase.co/rest/v1/rpc/'+(arenaMode?'agc_ctf_arena_help':'agc_ctf_help'),{method:'POST',headers:{apikey:'sb_publishable_Ty3Beae5ztODv0MM3Z_HDA_WEGwOyLP',Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_mission:m})});const d=await r.json();if(!r.ok)throw Error(d.message||'Błąd serwera');return d}
function switchMode(v){run(async()=>{arenaMode=v;lab=null;globalThis.GenesisFragments?.stop();globalThis.GenesisEvidence?.stop();globalThis.GenesisAdvanced?.stop();$('lab').hidden=true;$('campaign').classList.toggle('active',!v);$('arena').classList.toggle('active',v);$('categories').hidden=!v;await refresh()})}
$('campaign').onclick=()=>switchMode(false);$('arena').onclick=()=>switchMode(true);
$('categories').textContent=categories.join(' · ')+' — katalog kategorii; dedykowane zadania w przygotowaniu. Poniżej dostępne laboratoria treningowe.';
$('hint').onclick=()=>run(async()=>{if(!lab||(!testerMode&&!confirm('Otworzyć podpowiedź? Przed zaliczeniem: −200 pkt.')))return;const h=await helpRpc('hint',lab.mission);$('helpText').textContent=globalThis.GenesisAdvanced?.active()?GenesisAdvanced.hint():globalThis.GenesisEvidence?.active()?GenesisEvidence.hint():globalThis.GenesisFragments?.active()?GenesisFragments.hint():h.text;await refresh()});
$('review').onclick=()=>run(async()=>{if(!lab)return;const solved=progress.some(x=>x.mission===lab.mission&&x.solved);if(!solved&&!testerMode&&!confirm('Omówienie przed zaliczeniem kosztuje 500 GCO i −500 pkt. Ponowny dostęp bez opłat. Kontynuować?'))return;const h=await helpRpc('review',lab.mission);$('helpText').textContent=globalThis.GenesisAdvanced?.active()?GenesisAdvanced.review():globalThis.GenesisEvidence?.active()?GenesisEvidence.review():globalThis.GenesisFragments?.active()?GenesisFragments.review():h.text;await refresh()});

$('refresh').onclick=()=>run(refresh);for(const c of ['help','scan','ls','pwd','cd /','clear']){const b=document.createElement('button');b.textContent=c;b.onclick=()=>command(c);$('quick').append(b)}run(refresh);
</script><script defer src="./genesis-cyber-op01.js?v=2035r16"></script><script defer src="./genesis-cyber-progress.js?v=2035r16"></script><script defer src="./genesis-cyber-op02.js?v=2035r16"></script><script defer src="./genesis-cyber-op0304.js?v=2035r16"></script><script defer src="./genesis-cyber-op0506.js?v=2035r16"></script><script defer src="./genesis-cyber-op0708.js?v=2035r16"></script></body></html>
