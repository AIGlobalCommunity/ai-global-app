<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Cyber Operations</title><style>*{box-sizing:border-box}body{margin:0;background:#070e17;color:#dce9ef;font:15px system-ui}main{max-width:1500px;margin:auto;padding:16px}header,section,aside,article{background:#10202d;border:1px solid #294653;border-radius:10px;padding:16px;margin-bottom:12px}h1,h2,h3{color:#69e5b9;margin:8px 0}button,input{font:inherit;color:inherit;background:#152d3a;border:1px solid #42606b;border-radius:6px;padding:10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active{border-color:#69e5b9;background:#18443e}#missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}#nodes{display:grid;gap:8px}.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}#output{background:#02090e;color:#8af3bd;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;height:clamp(320px,48vh,650px);padding:14px;font:14px/1.6 Consolas,monospace;border:1px solid #294653}form{display:flex;align-items:center;gap:8px;background:#02090e;padding:8px;font:13px monospace}form input{flex:1;min-width:0;background:transparent}#quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}#msg{color:#ffcf86}#answer{width:min(100%,500px)}a{color:#69e5b9}@media(max-width:700px){main{padding:8px}.work{grid-template-columns:1fr}#nodes{grid-template-columns:1fr 1fr}form{flex-wrap:wrap}#output{height:340px}}</style></head><body><main><header><a href="/" target="_top">← The Genesis Era</a><h1>GENESIS CYBER OPERATIONS / 2035</h1><p>ISOLATED TRAINING ENVIRONMENT · <strong id="balance">—</strong> <button id="refresh">Odśwież</button></p><p id="msg" role="status"></p></header><section><h2>Campaign control</h2><p>10 misji bezpłatnych · kolejne 10 GCO · ponowne próby bez opłat</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button id="campaign">Kampania fabularna</button><button id="arena">CTF Arena</button><strong id="points"></strong></div><div id="categories" hidden></div><div id="missions"></div></section><section id="lab" hidden><h2 id="title"></h2><p id="brief"></p><div class="work"><aside><h3>NETWORK TOPOLOGY</h3><p id="session"></p><div id="nodes"></div></aside><article><h3>GENESIS SHELL / SECURE SESSION</h3><div id="output" role="log"></div><form id="cmdform"><span id="prompt"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Polecenie"><button>ENTER</button></form><div id="quick"></div></article></div><label>FLAG <input id="answer" placeholder="GENESIS{...}" autocomplete="off"></label> <button id="submit">VERIFY FLAG</button><div style="margin-top:12px"><button id="hint">Podpowiedź (−200 pkt)</button> <button id="review">Omów rozwiązanie</button><pre id="helpText" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div></section></main><script>
const $=id=>document.getElementById(id);let arenaMode=false;const categories=['Cryptography','Web Security','Digital Forensics','Blue Team','Network Security','Reverse Engineering','OSINT','Steganography','AI Security','Linux Security'];
const names=['Hex Protocol','Hidden Message','Reverse Signal','Layered Cipher','Silent Intruder','Digital Evidence','Network Anomaly','Configuration Audit','Classified Report','Fragmented Signal'];
const tasks=['Odczytaj HEX','Odczytaj Base64','Odwróć ciąg znaków','Odczytaj HEX, następnie odwróć tekst','Znajdź potwierdzony incydent w logach','Odczytaj dowód z JSON','Znajdź odrzucony pakiet w CSV','Sprawdź sekcję incident','Odczytaj dowód z XML','Połącz fragmenty według sequence'];
const artifacts=['payload.hex','message.b64','reverse.txt','layered.hex','security.log','report.json','traffic.csv','service.ini','report.xml','fragments.txt'];
const hosts=['gateway','soc','archive','vault','workstation'];let lab=null,host='gateway',cwd='/',seen=new Set(),history=[],pos=0,busy=false,progress=[];
function token(){for(const k of ['sb-gjnddmurmegbklvedhnp-auth-token','supabase.auth.token'])try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v?.access_token||v?.currentSession?.access_token)return v.access_token||v.currentSession.access_token}catch{}return null}
async function rpc(action,m=1,answer=''){const t=token();if(!t)throw Error('Zaloguj się w zakładce Konto, a następnie wróć do gry.');const r=await fetch('https://gjnddmurmegbklvedhnp.supabase.co/rest/v1/rpc/'+(arenaMode?'agc_ctf_arena':'agc_ctf'),{method:'POST',headers:{apikey:'sb_publishable_Ty3Beae5ztODv0MM3Z_HDA_WEGwOyLP',Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_mission:m,p_answer:answer})});const d=await r.json();if(!r.ok)throw Error(d.message||'Błąd serwera');return d}
function out(t){const e=$('output');e.textContent+=String(t)+'\n';if(e.textContent.length>40000)e.textContent=e.textContent.slice(-35000);e.scrollTop=e.scrollHeight}
function target(){return ['archive','vault','workstation','archive','soc','vault','soc','gateway','archive','workstation'][lab.mode]}
function fs(){const files={'/README.txt':'Isolated Genesis training environment. Use help, scan, connect, ls, cd, cat.','/etc/hostname':host,'/logs/system.log':'INFO boot complete\nINFO network isolated\nINFO training session '+lab.mission};if(host==='soc')files['/logs/audit.log']='NOTICE evidence stored on '+target()+':/evidence/'+artifacts[lab.mode];if(host===target())files['/evidence/'+artifacts[lab.mode]]=lab.clue;return files}
function resolve(p){const parts=(p.startsWith('/')?p:cwd+'/'+p).split('/'),a=[];for(const x of parts){if(x==='..')a.pop();else if(x&&x!=='.')a.push(x)}return '/'+a.join('/')}
function listing(p){const prefix=p==='/'?'/':p+'/';return [...new Set(Object.keys(fs()).filter(k=>k.startsWith(prefix)).map(k=>{const x=k.slice(prefix.length);return x.includes('/')?x.split('/')[0]+'/':x}))]}
function draw(){ $('prompt').textContent='operator@'+host+':'+cwd+' $';$('nodes').replaceChildren();hosts.forEach((h,i)=>{const b=document.createElement('button');b.disabled=!seen.has(h);b.className=h===host?'active':'';b.textContent=seen.has(h)?h.toUpperCase()+' · 192.0.2.'+(i+1):'UNKNOWN NODE';b.onclick=()=>command('connect '+h);$('nodes').append(b)});$('session').textContent=seen.size+'/'+hosts.length+' węzłów · '+host}
function command(raw){if(!lab)return;const cmd=raw.trim().slice(0,2048);if(!cmd)return;history.push(cmd);pos=history.length;out($('prompt').textContent+' '+cmd);const [op,...args]=cmd.split(/\s+/),arg=args.join(' ');try{const files=fs();const read=p=>{const k=resolve(p);if(!Object.prototype.hasOwnProperty.call(files,k))throw Error('Nie znaleziono pliku: '+k);return files[k]};switch(op){
case 'help':out('scan | connect HOST | disconnect | pwd | whoami | hostname | ls [PATH] | cd PATH | cat FILE | grep TEXT FILE | head FILE | tail FILE | sort FILE | file FILE | decode hex DATA | decode base64 DATA | reverse DATA | clear');break;
case 'scan':hosts.forEach((h,i)=>{seen.add(h);out('192.0.2.'+(i+1)+'  '+h+'  ONLINE')});draw();break;
case 'connect':if(!seen.has(arg))throw Error('Nieodkryty host');host=arg;cwd='/';draw();break;
case 'disconnect':host='gateway';cwd='/';draw();break;
case 'pwd':out(cwd);break;case 'whoami':out('operator');break;case 'hostname':out(host);break;
case 'ls':out(listing(resolve(arg||'.')).join('  ')||'(pusty lub nieistniejący katalog)');break;
case 'cd':{const p=resolve(arg||'/');if(p!=='/'&&!listing(p).length)throw Error('Nie istnieje katalog');cwd=p;draw();break}
case 'cat':out(read(arg));break;
case 'grep':{const needle=args.shift();out(read(args.join(' ')).split('\n').filter(x=>x.includes(needle)).join('\n')||'Brak dopasowań');break}
case 'head':out(read(arg).split('\n').slice(0,5).join('\n'));break;
case 'tail':out(read(arg).split('\n').slice(-5).join('\n'));break;
case 'sort':out(read(arg).split('\n').sort().join('\n'));break;
case 'file':read(arg);out('Text artifact: '+arg);break;
case 'decode':{const kind=args.shift(),data=args.join(' ');if(kind==='hex'){if(!/^(?:[0-9a-f]{2})+$/i.test(data))throw Error('Invalid HEX');out(new TextDecoder().decode(Uint8Array.from(data.match(/../g),x=>parseInt(x,16))))}else if(kind==='base64')out(new TextDecoder().decode(Uint8Array.from(atob(data),x=>x.charCodeAt(0))));else throw Error('Unknown encoding');break}
case 'reverse':out(Array.from(arg).reverse().join(''));break;
case 'clear':$('output').textContent='';break;default:out('Unknown command. Type help.');
}}catch(e){out('ERROR: '+e.message)}}
function init(v){$('helpText').textContent='';lab=v;host='gateway';cwd='/';seen=new Set(['gateway']);history=[];pos=0;$('lab').hidden=false;$('title').textContent='OP '+String(v.mission).padStart(2,'0')+' / '+names[v.mode];$('brief').textContent=tasks[v.mode]+' • Odkryj sieć i sprawdź /logs/audit.log na SOC.';$('output').textContent='';$('answer').value='';out('GENESIS OS 2035 | TRAINING SHELL | type help');draw();$('lab').scrollIntoView({behavior:'smooth'})}
async function run(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message}finally{busy=false}}
async function refresh(){const d=await rpc('status');const score=await helpRpc('status',1);$('points').textContent=score.points+' pkt';progress=d.missions;$('balance').textContent=d.balance+' GCO';$('missions').replaceChildren();for(let i=1;i<=20;i++){const p=progress.find(x=>x.mission===i),b=document.createElement('button');b.textContent=String(i).padStart(2,'0')+' · '+names[(i-1)%10]+' · '+(p?.solved?'✓':p?'OPEN':i<=10?'FREE':'10 GCO');b.disabled=!arenaMode&&i>1&&!progress.some(x=>x.mission===i-1&&x.solved);b.onclick=()=>run(async()=>{if(!p&&i>10&&!confirm('Odblokować za 10 GCO?'))return;init(await rpc(p?'open':'unlock',i));await refresh()});$('missions').append(b)}}
$('cmdform').onsubmit=e=>{e.preventDefault();command($('cmd').value);$('cmd').value='';$('cmd').focus()};
$('cmd').onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();pos=Math.max(0,Math.min(history.length,pos+(e.key==='ArrowUp'?-1:1)));$('cmd').value=history[pos]||''}};
$('submit').onclick=()=>run(async()=>{if(!lab)return;const v=await rpc('submit',lab.mission,$('answer').value);$('msg').textContent=v.solved?'MISJA UKOŃCZONA':'Niepoprawna flaga';await refresh()});

async function helpRpc(action,m){const t=token();if(!t)throw Error('Zaloguj się');const r=await fetch('https://gjnddmurmegbklvedhnp.supabase.co/rest/v1/rpc/'+(arenaMode?'agc_ctf_arena_help':'agc_ctf_help'),{method:'POST',headers:{apikey:'sb_publishable_Ty3Beae5ztODv0MM3Z_HDA_WEGwOyLP',Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_mission:m})});const d=await r.json();if(!r.ok)throw Error(d.message||'Błąd serwera');return d}
function switchMode(v){run(async()=>{arenaMode=v;lab=null;$('lab').hidden=true;$('campaign').classList.toggle('active',!v);$('arena').classList.toggle('active',v);$('categories').hidden=!v;await refresh()})}
$('campaign').onclick=()=>switchMode(false);$('arena').onclick=()=>switchMode(true);
$('categories').textContent=categories.join(' · ')+' — katalog kategorii; dedykowane zadania w przygotowaniu. Poniżej dostępne laboratoria treningowe.';
$('hint').onclick=()=>run(async()=>{if(!lab||!confirm('Otworzyć podpowiedź? Przed zaliczeniem: −200 pkt.'))return;$('helpText').textContent=(await helpRpc('hint',lab.mission)).text;await refresh()});
$('review').onclick=()=>run(async()=>{if(!lab)return;const solved=progress.some(x=>x.mission===lab.mission&&x.solved);if(!solved&&!confirm('Omówienie przed zaliczeniem kosztuje 500 GCO i −500 pkt. Ponowny dostęp bez opłat. Kontynuować?'))return;$('helpText').textContent=(await helpRpc('review',lab.mission)).text;await refresh()});

$('refresh').onclick=()=>run(refresh);for(const c of ['help','scan','ls','pwd','cd /','clear']){const b=document.createElement('button');b.textContent=c;b.onclick=()=>command(c);$('quick').append(b)}run(refresh);
</script></body></html>
