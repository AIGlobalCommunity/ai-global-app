<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis Cyber War 2035</title><style> *{box-sizing:border-box}body{margin:0;background:#07121d;color:#e4f4ef;font:16px system-ui}main{max-width:1000px;margin:auto;padding:18px}header,section{background:#102431;border:1px solid #285b62;border-radius:14px;padding:18px;margin-bottom:14px}h1,h2{color:#65e7bc}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #42877c;background:#142f3c;color:white}button{cursor:pointer}button:disabled{opacity:.5}#missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#030c12;padding:16px;color:#8fffd0}input{width:100%;margin:8px 0}a{color:#65e7bc}#msg{color:#ffd18a}</style><main><header><a href="/">← The Genesis Era</a><h1>GENESIS CYBER WAR 2035</h1><p>Cyber Academy • Kampania treningowa • 20 misji</p><strong id="balance">Saldo: —</strong> <button id="refresh">Odśwież</button><p id="msg" role="status"></p></header><section><h2>Centrum operacyjne</h2><p>Każda misja kosztuje 10 GCO. Ponowne próby są bezpłatne. Ukończ poprzednią misję, aby odblokować następną.</p><div id="missions"></div></section><section id="lab" hidden><h2 id="title"></h2><p id="brief"></p><pre id="clue"></pre><label>Flaga<input id="answer" autocomplete="off" placeholder="GENESIS{...}"></label><button id="submit">Zweryfikuj flagę</button></section></main><script>
const $=x=>document.getElementById(x);let state=[],mission=0,busy=false;
function token(){for(const k of ['sb-gjnddmurmegbklvedhnp-auth-token','supabase.auth.token'])try{const s=JSON.parse(localStorage.getItem(k)||'null');const t=s?.access_token||s?.currentSession?.access_token;if(t)return t}catch{}return null}
async function rpc(action,m=1,answer=''){const t=token();if(!t)throw Error('Zaloguj się w zakładce Konto, a następnie wróć do gry.');const r=await fetch('https://gjnddmurmegbklvedhnp.supabase.co/rest/v1/rpc/agc_ctf',{method:'POST',headers:{apikey:'sb_publishable_Ty3Beae5ztODv0MM3Z_HDA_WEGwOyLP',Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_mission:m,p_answer:answer})});const d=await r.json();if(!r.ok)throw Error(d.message||'Błąd serwera');return d}
async function refresh(){const d=await rpc('status');state=d.missions;$('balance').textContent='Saldo: '+d.balance+' GCO';$('missions').replaceChildren();for(let i=1;i<=20;i++){const p=state.find(x=>x.mission===i),b=document.createElement('button');b.textContent='Misja '+i+' • '+(p?.solved?'✓':p?'Otwórz':'10 GCO');b.disabled=i>1&&!state.some(x=>x.mission===i-1&&x.solved);b.onclick=()=>run(async()=>{if(!p&&!confirm('Odblokować misję '+i+' za 10 GCO?'))return;const v=await rpc(p?'open':'unlock',i);mission=i;$('lab').hidden=false;$('title').textContent='Misja '+i;$('brief').textContent=['Odzyskaj flagę z zapisu szesnastkowego.','Odczytaj dane Base64.','Przywróć właściwą kolejność znaków.','Odczytaj zapis szesnastkowy i odwróć kolejność znaków.'][v.mode];$('clue').textContent=v.clue;$('answer').value='';await refresh();$('lab').scrollIntoView({behavior:'smooth'})});$('missions').append(b)}}
async function run(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message}finally{busy=false}}
$('refresh').onclick=()=>run(refresh);$('submit').onclick=()=>run(async()=>{const v=await rpc('submit',mission,$('answer').value);$('msg').textContent=v.solved?'Flaga poprawna. Misja ukończona!':'Niepoprawna flaga. Spróbuj ponownie.';await refresh()});run(refresh);
</script></html>
