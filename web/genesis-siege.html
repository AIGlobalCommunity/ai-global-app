<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GENESIS SIEGE</title><style>
*{box-sizing:border-box}body{margin:0;background:#081328;color:#e6f8ff;font:16px system-ui;display:flex;flex-direction:column;height:100dvh;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;background:#10243b}button{background:#254968;color:white;border:1px solid #64c8ee;border-radius:9px;padding:9px;cursor:pointer}canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}main{flex:1;min-height:0;position:relative}#menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#071429cc;padding:20px}#menu[hidden]{display:none}p{max-width:540px}#status{font-size:12px}</style><header><strong>GENESIS SIEGE</strong><span id="hud"></span><button id="pause">Ⅱ</button><button id="sound">🔊</button><button id="exit">✕</button></header><main><canvas id="c" width="1000" height="550"></canvas><section id="menu"><h1 id="title">GENESIS SIEGE</h1><p id="desc">Przeciągnij kulę w lewo i puść. Zniszcz roboty oraz ich wieże. Klawiatura: strzałki i spacja.</p><button id="start">Rozpocznij</button><button id="share">Udostępnij wynik</button></section></main><footer><button id="up">↑</button><button id="down">↓</button><button id="less">− moc</button><button id="more">+ moc</button><button id="fire">STRZAŁ</button><button id="restart">Od nowa</button><span id="status"></span></footer><script>
'use strict';
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),G=490,origin={x:150,y:420};let level=1,score=0,shots=5,bodies=[],ball=null,aim={x:-75,y:35},drag=false,active=false,paused=false,sound=true,audio,last=0,elapsed=0,wait=0,particles=[],ended=false;
function tone(f){if(!sound)return;try{audio??=new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.17);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch{}}
function post(type,extra={}){if(parent!==window)parent.postMessage(JSON.stringify({type,game:'siege',...extra}),location.origin)}
function report(){if(score<10)return;const p={type:'genesis-game-score',game:'siege',score,level};try{const k='agc-game-pending-siege',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<score)localStorage.setItem(k,JSON.stringify(p));localStorage.setItem('siege-best',Math.max(score,Number(localStorage.getItem('siege-best')||0)))}catch{}post(p.type,p)}
function build(){bodies=[];ball=null;wait=0;shots=5+Math.floor(level/10);const towers=2+Math.floor((level-1)/10);for(let t=0;t<towers;t++){let x=550+t*105;let rows=2+(level+t)%4;for(let j=0;j<rows;j++){for(let k=0;k<2;k++){let steel=(level+j+k+t)%4===0;bodies.push({x:x+k*43,y:490-j*35,w:41,h:34,vx:0,vy:0,hp:steel?3:1,steel,robot:false,awake:false})}}bodies.push({x:x+20,y:490-rows*35,w:34,h:34,vx:0,vy:0,hp:1,robot:true,awake:false})}hud()}
function hud(){$('hud').textContent='LV '+level+'/30 · '+score+' pkt · '+shots+' pocisków'}
function reset(){level=1;score=0;ended=false;active=true;paused=false;build();$('menu').hidden=true}
function launch(){if(!active||paused||ball||shots<=0)return;let length=Math.hypot(aim.x,aim.y);if(length<15)return;ball={x:origin.x,y:origin.y,vx:-aim.x*7,vy:-aim.y*7,r:12,age:0};shots--;tone(220);hud()}
function hit(a,b){return a.x+a.w/2>b.x-b.w/2&&a.x-a.w/2<b.x+b.w/2&&a.y+a.h/2>b.y-b.h/2&&a.y-a.h/2<b.y+b.h/2}
function burst(b){for(let i=0;i<12;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*220,vy:-Math.random()*180,t:.6,color:b.robot?'#ff5277':'#ffd18a'});score+=b.robot?500:100;tone(b.robot?660:110);report();hud()}
function step(dt){elapsed+=dt;if(ball){ball.age+=dt;ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(const b of bodies){if(b.hp>0&&Math.abs(ball.x-b.x)<b.w/2+12&&Math.abs(ball.y-b.y)<b.h/2+12){b.hp--;b.awake=true;b.vx=ball.vx*.45;b.vy=ball.vy*.3-40;ball.vx*=.68;ball.vy=-Math.abs(ball.vy)*.3;if(b.hp===0)burst(b);break}}if(ball.y>510){ball.y=510;ball.vy*=-.35;ball.vx*=.72}if(ball.age>5||ball.x>1030||ball.x<-30||Math.hypot(ball.vx,ball.vy)<18){ball=null;wait=.6}}
for(const b of bodies){if(b.hp<=0)continue;const support=bodies.some(a=>a!==b&&a.hp>0&&Math.abs(a.x-b.x)<(a.w+b.w)/2-3&&Math.abs(a.y-a.h/2-(b.y+b.h/2))<5);if(!support&&b.y+b.h/2<507)b.awake=true;if(!b.awake)continue;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;for(const a of bodies){if(a===b||a.hp<=0||!hit(a,b))continue;if(Math.abs(b.vx)>70){a.awake=true;a.vx+=b.vx*.55;b.vx*=.45;if(a.robot){a.hp=0;burst(a)}}if(b.vy>0&&b.y<a.y){if(b.robot&&b.vy>120){b.hp=0;burst(b);break}b.y=a.y-a.h/2-b.h/2;b.vy=0}}if(b.y+b.h/2>507){if(b.robot&&b.vy>100){b.hp=0;burst(b)}b.y=507-b.h/2;b.vy=0;b.vx*=.85}if(b.x>1020||b.x<0){b.hp=0;burst(b)}}
particles=particles.filter(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=G*dt;return p.t>0});if(wait>0)wait-=dt;if(!bodies.some(b=>b.robot&&b.hp>0)){if(level===30){finish('Zwycięstwo!');return}score+=shots*100;level++;report();build()}else if(!ball&&wait<=0&&shots===0)finish('Koniec misji')}
function finish(t){active=false;ended=true;report();$('title').textContent=t;$('desc').textContent=score+' punktów · poziom '+level;$('start').textContent='Zagraj ponownie';$('menu').hidden=false}
function draw(){let g=ctx.createLinearGradient(0,0,0,550);g.addColorStop(0,'#071429');g.addColorStop(1,'#315a77');ctx.fillStyle=g;ctx.fillRect(0,0,1000,550);ctx.fillStyle='#203951';for(let i=0;i<14;i++)ctx.fillRect(i*80,340-(i*37%100),58,170);ctx.fillStyle='#14283b';ctx.fillRect(0,507,1000,43);ctx.strokeStyle='#51d6ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(120,507);ctx.lineTo(150,420);ctx.lineTo(180,507);ctx.stroke();for(const b of bodies){if(b.hp<=0)continue;ctx.fillStyle=b.robot?'#fb557b':b.steel?'#849bb3':'#d5a56d';ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.strokeStyle='#10243b';ctx.lineWidth=2;ctx.strokeRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);if(b.robot){ctx.fillStyle='#071429';ctx.fillRect(b.x-11,b.y-8,22,9);ctx.fillStyle='#fff';ctx.fillRect(b.x-8,b.y-6,4,4);ctx.fillRect(b.x+4,b.y-6,4,4)}}if(!ball&&active){ctx.strokeStyle='#91e8ff';ctx.setLineDash([4,9]);ctx.beginPath();for(let i=0;i<35;i++){let t=i*.045,x=origin.x-aim.x*7*t,y=origin.y-aim.y*7*t+G*t*t/2;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([])}const p=ball||{x:origin.x+(drag?aim.x:0),y:origin.y+(drag?aim.y:0)};ctx.fillStyle='#69ecff';ctx.shadowBlur=18;ctx.shadowColor='#39d8ff';ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}}
function frame(t){let dt=Math.min(.025,(t-last)/1000||0);last=t;if(active&&!paused)step(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function point(e){const r=c.getBoundingClientRect(),s=Math.min(r.width/1000,r.height/550);return{x:(e.clientX-r.left-(r.width-1000*s)/2)/s,y:(e.clientY-r.top-(r.height-550*s)/2)/s}}
function setAim(e){const p=point(e);let x=Math.min(-10,p.x-origin.x),y=p.y-origin.y,m=Math.max(1,Math.hypot(x,y)/115);aim={x:x/m,y:y/m}}
c.onpointerdown=e=>{if(active&&!ball&&!paused){drag=true;c.setPointerCapture(e.pointerId);setAim(e)}};c.onpointermove=e=>{if(drag)setAim(e)};c.onpointerup=e=>{if(drag){setAim(e);drag=false;launch()}};c.onpointercancel=()=>drag=false;
function adjust(x,y){aim.x=Math.max(-115,Math.min(-15,aim.x+x));aim.y=Math.max(-90,Math.min(100,aim.y+y))}
$('up').onclick=()=>adjust(0,8);$('down').onclick=()=>adjust(0,-8);$('less').onclick=()=>adjust(8,0);$('more').onclick=()=>adjust(-8,0);$('fire').onclick=launch;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' ')launch();else if(e.key==='ArrowUp')adjust(0,8);else if(e.key==='ArrowDown')adjust(0,-8);else adjust(e.key==='ArrowLeft'?-8:8,0)}});
$('start').onclick=reset;$('restart').onclick=()=>{report();reset()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';report()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};$('exit').onclick=()=>{report();post('genesis-siege-exit-fullscreen');if(parent===window)location.href='/'};$('share').onclick=()=>{if(parent!==window)post('genesis-share-finished-score',{score});else window.open('/share-result.html?game=siege&score='+score,'_blank')};addEventListener('pagehide',report);addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;try{let p=JSON.parse(e.data);if(p.type==='genesis-score-status'&&p.game==='siege')$('status').textContent=p.state==='saved'?'Zapisano online':p.state==='error'?'Błąd zapisu':'Oczekuje na zapis'}catch{}});build();
</script></html>
