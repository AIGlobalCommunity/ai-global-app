<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dołącz do The Genesis Era</title><style>body{background:#091e29;color:#fff;font:17px system-ui;margin:0;padding:24px}main{max-width:480px;margin:8vh auto;background:#14333e;padding:24px;border-radius:18px}h1{color:#f3d48e}a{color:#f3d48e}</style><main><h1>The Genesis Era</h1><h2>Zaproszenie do gry</h2><p id="status" role="status">Sprawdzanie zaproszenia…</p><p id="account-status"></p><p><a id="login-account" href="/" target="_blank" rel="noopener">Zaloguj się na swoje konto w portalu</a></p><button type="button" id="refresh-account">Sprawdź zalogowanie i dołącz</button><form id="join" hidden><button type="button" id="account-join" hidden>Dołącz na swoim koncie – z rankingiem</button><label>Nick <input id="nick" required minlength="2" maxlength="32"></label><p><label><input type="checkbox" id="rules" required> Akceptuję zasady: punkty są wirtualne, bez nagród i rankingu globalnego.</label></p><button>Dołącz do gry</button></form><a href="/">Strona główna</a></main><script src="genesis-multiplayer.js"></script><script>const statusEl=document.getElementById('status');const accountButton=document.getElementById('account-join');function refreshAccount(){const token=GenesisInvites.accountToken();accountButton.hidden=!token;document.getElementById('login-account').hidden=!!token;document.getElementById('refresh-account').hidden=!!token;document.getElementById('account-status').textContent=token?'Wykryto sesję konta. Możesz dołączyć z rankingiem.':'Zaloguj się w nowej karcie, a następnie wróć tutaj. Zaproszenie pozostanie aktywne.';return token}refreshAccount();addEventListener('focus',refreshAccount);addEventListener('storage',refreshAccount);document.getElementById('refresh-account').onclick=()=>{if(refreshAccount())accountButton.click()};const invite=new URLSearchParams(location.hash.slice(1)).get('invite');GenesisInvites.inspect(invite).then(r=>{statusEl.textContent='Zaproszenie do '+({blackjack:'Blackjack 21',hearts:'Kierki',duck:'Duck Hunt'}[r.game]||r.game)+' jest ważne.';document.getElementById('join').hidden=!['blackjack','hearts','duck'].includes(r.game)}).catch(e=>statusEl.textContent=e.message);accountButton.onclick=async()=>{accountButton.disabled=true;try{const r=await GenesisInvites.call('join_account',{invite,rules:true},GenesisInvites.accountToken());sessionStorage.setItem('genesis-'+r.game+'-guest',JSON.stringify({room:r.room,account:true}));location.replace('/genesis-'+r.game+'.html')}catch(e){statusEl.textContent=e.message;accountButton.disabled=false}};document.getElementById('join').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button:not([type=button])');button.disabled=true;try{const r=await GenesisInvites.call('join',{invite,nickname:document.getElementById('nick').value,rules:document.getElementById('rules').checked});if(!['blackjack','hearts','duck'].includes(r.game))throw Error('Nieobsługiwana gra');sessionStorage.setItem('genesis-'+r.game+'-guest',JSON.stringify({room:r.room,session:r.session}));location.replace('/genesis-'+r.game+'.html')}catch(err){statusEl.textContent=err.message;button.disabled=false}};</script></html>
