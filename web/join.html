<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dołącz do The Genesis Era</title><style>body{background:#091e29;color:#fff;font:17px system-ui;margin:0;padding:24px}main{max-width:480px;margin:8vh auto;background:#14333e;padding:24px;border-radius:18px}h1{color:#f3d48e}a{color:#f3d48e}</style><main><h1>The Genesis Era</h1><h2>Zaproszenie do gry</h2><p id="status" role="status">Sprawdzanie zaproszenia…</p><form id="join" hidden><label>Nick <input id="nick" required minlength="2" maxlength="32"></label><p><label><input type="checkbox" id="rules" required> Akceptuję zasady: punkty są wirtualne, bez nagród i rankingu globalnego.</label></p><button>Dołącz do gry</button></form><a href="/">Strona główna</a></main><script src="genesis-multiplayer.js"></script><script>const statusEl=document.getElementById('status');const invite=new URLSearchParams(location.hash.slice(1)).get('invite');GenesisInvites.inspect(invite).then(r=>{statusEl.textContent='Zaproszenie do '+({blackjack:'Blackjack 21',hearts:'Kierki',duck:'Duck Hunt'}[r.game]||r.game)+' jest ważne.';document.getElementById('join').hidden=!['blackjack','hearts'].includes(r.game)}).catch(e=>statusEl.textContent=e.message);document.getElementById('join').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await GenesisInvites.call('join',{invite,nickname:document.getElementById('nick').value,rules:document.getElementById('rules').checked});if(!['blackjack','hearts'].includes(r.game))throw Error('Nieobsługiwana gra');sessionStorage.setItem('genesis-'+r.game+'-guest',JSON.stringify({room:r.room,session:r.session}));location.replace('/genesis-'+r.game+'.html')}catch(err){statusEl.textContent=err.message;button.disabled=false}};</script></html>
