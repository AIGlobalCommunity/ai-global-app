<!doctype html><html lang=pl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genesis Crystals</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at top,#284e68,#071324 70%);color:#eafaff;font:600 15px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}header,footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}button{background:#193e54;color:white;border:1px solid #7ad8df;border-radius:9px;padding:8px;cursor:pointer}#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(94vw,58dvh,560px);aspect-ratio:1;touch-action:none;padding:6px;background:#071c2dee;border:2px solid #75c6ce;border-radius:15px;box-shadow:0 0 30px #48d3ff33}.cell{padding:0;min-width:0;aspect-ratio:1;background:#173247;border:1px solid #345469;border-radius:7px;position:relative}.cell svg{width:95%;height:95%;display:block;margin:auto;filter:drop-shadow(0 2px 3px #0009)}.sel{outline:2px solid gold}.ice{box-shadow:inset 0 0 0 4px #95e7ff}.pop{animation:pop .2s forwards}@keyframes pop{to{transform:scale(.15);opacity:0}}.fall{animation:fall .23s ease-out}@keyframes fall{from{transform:translateY(-22%);opacity:.5}}#msg{color:#ffd776;text-align:center;min-height:22px}#hud{font-size:14px} .tilemark{position:absolute;right:1px;bottom:0;font-size:clamp(10px,2.4vmin,18px);background:#081b2cdd;border-radius:4px;padding:1px;pointer-events:none}.cell.hole{visibility:hidden}#demo{position:fixed;inset:0;background:#061322ed;z-index:10;display:none;place-items:center}#demo article{max-width:320px;text-align:center;padding:24px;border:1px solid #77ddeb;border-radius:16px;background:#18384e}#demo .example{font-size:36px;animation:demomove 1.5s infinite alternate}@keyframes demomove{to{transform:translateY(12px);filter:brightness(1.5)}} </style><header><button id=exit>✕</button><strong>GENESIS CRYSTALS</strong><button id=full>⛶</button><button id=mute>🔊</button></header><div id=hud></div><div id=board></div><div id=msg></div><footer><button id=hammer>⚒ Młot</button><button id=hint>Podpowiedź</button><button id=retry>Powtórz</button><button id=share>Udostępnij</button></footer><div id=demo><article><h2 id=demoTitle></h2><div class=example id=demoIcon></div><p id=demoText></p><button id=demoOk>Rozumiem — graj</button></article></div><script>
const $=id=>document.getElementById(id),N=8,C=['#fa526e','#39c9ff','#6ee693','#ffd557','#a889ff','#ff984b'];let tiles=[],goal=0,progress=0,turn=0,gravity=0,seen=new Set(),demoOpen=false;try{seen=new Set(JSON.parse(localStorage.getItem('crystals-demo')||'[]'))}catch{}const modes=['color','time','fruit','ice','chain','bomb','stone','vine','key','treasure','portal','gravity','lava','special','butterfly','tank','armor','platform','shape','mixed'];const info={color:'Zbieraj wskazany kolor',time:'Zbieraj kryształy przed upływem czasu',fruit:'Zrzuć owoce na dół',ice:'Rozbij wszystkie warstwy lodu',chain:'Dopasuj kryształy w łańcuchach',bomb:'Usuń bomby zanim licznik spadnie do zera',stone:'Twórz kombinacje obok kamieni',vine:'Usuwaj pnącza zanim się rozrosną',key:'Zrzuć klucze do skrzyń',treasure:'Odkryj skarby pod kryształami',boss:'Atakuj bossa każdą kombinacją',portal:'Portale zamieniają kryształy po kaskadzie',gravity:'Grawitacja zmienia kierunek po ruchu',lava:'Zatrzymaj lawę kombinacjami obok niej',special:'Utwórz specjalne kryształy',butterfly:'Dopasuj kolor motyla przed dotarciem do góry',tank:'Napełnij zbiornik wskazanym kolorem',armor:'Rozbij warstwy pancerza',platform:'Ruchome rzędy zmieniają położenie kryształów',shape:'Graj w nieregularnym układzie',mixed:'Zbierz kolor i usuń przeszkody'};let mission='color',seconds=0,fruitGoal=0,fruitGot=0,fruitSerial=0;let b=[],ice=[],level=1,score=0,base=0,moves=0,target=0,got=0,col=0,selected=-1,busy=false,done=false,hammer=1,armed=false,sound=true,ac;try{level=Math.max(1,Math.min(1000,Number(localStorage.getItem('crystals-level'))||1))}catch{}const rnd=()=>Math.floor(Math.random()*6),wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(f){if(!sound)return;try{ac??=new AudioContext();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.04,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.17)}catch{}}
function report(){if(score<10)return;let p={type:'genesis-game-score',game:'crystals',score,level,at:Date.now()};try{let k='agc-game-pending-crystals',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<=score)localStorage.setItem(k,JSON.stringify(p))}catch{}if(parent!==window)parent.postMessage(JSON.stringify(p),location.origin)}
const mark={ice:'🧊',chain:'⛓',bomb:'💣',stone:'🪨',vine:'🌿',treasure:'🏆',lava:'🔥',armor:'🛡',portal:'🌀',butterfly:'🦋',hole:'',platform:'↔'};const blocked=i=>tiles[i]?.type==='hole'||tiles[i]?.type==='stone';const locked=i=>blocked(i)||tiles[i]?.type==='chain';function demo(){if(seen.has(mission))return;demoOpen=true;$('demoTitle').textContent='Nowa misja: '+mission;$('demoIcon').textContent=mark[mission]||'💎 ✨ 💎';$('demoText').textContent=info[mission];$('demo').style.display='grid'}$('demoOk').onclick=()=>{seen.add(mission);try{localStorage.setItem('crystals-demo',JSON.stringify([...seen]))}catch{}demoOpen=false;$('demo').style.display='none'};function runs(){let out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x,v=b[i];if(!v||v.fruit||blocked(i))continue;for(let d of [1,N]){if(d===1&&x>0&&!blocked(i-1)&&!b[i-1]?.fruit&&b[i-1]?.c===v.c||d===N&&y>0&&!blocked(i-N)&&!b[i-N]?.fruit&&b[i-N]?.c===v.c)continue;let a=[i],j=i+d;while(j<64&&(d===N||Math.floor(j/N)===y)&&!blocked(j)&&!b[j]?.fruit&&b[j]?.c===v.c){a.push(j);j+=d}if(a.length>=3)out.push({a,d})}}return out}
function swap(i,j){[b[i],b[j]]=[b[j],b[i]]}function hint(){for(let i=0;i<64;i++)for(let j of [i+1,i+8]){if(j>=64||locked(i)||locked(j)||j===i+1&&i%8===7)continue;swap(i,j);let ok=runs().length||b[i]?.s==='nova'||b[j]?.s==='nova';swap(i,j);if(ok)return [i,j]}return null}
function fill(){let tries=0;do{b=[];for(let i=0;i<64;i++){let c;do{c=rnd()}while(i%8>=2&&b[i-1].c===c&&b[i-2].c===c||i>=16&&b[i-8].c===c&&b[i-16].c===c);b.push({c})}}while(!hint()&&++tries<100)}
function hud(){$('hud').textContent='Poziom '+level+' / 1000 · Punkty '+score+(mission==='time'?' · Czas '+seconds+' s':' · Ruchy '+moves)+(mission==='fruit'?' · Owoce '+fruitGot+'/'+fruitGoal:' · Cel '+got+'/'+target)+' · '+info[mission]+(goal?' '+progress+'/'+goal:'')+(tiles.some(t=>t&&!['hole','portal','platform'].includes(t.type))?' · Przeszkody '+tiles.filter(t=>t&&!['hole','portal','platform'].includes(t.type)).length:'');$('hammer').textContent='⚒ Młot '+hammer}
function draw(fall=false){$('board').innerHTML=b.map((v,i)=>{let t=tiles[i],tag=t?'<span class=tilemark>'+mark[t.type]+(t.hp>1?t.hp:'')+'</span>':'';if(blocked(i))return '<button class="cell '+(t.type==='hole'?'hole':'')+'" data-i="'+i+'">'+tag+'</button>';if(v.fruit)return '<button data-i="'+i+'" class="cell '+(selected===i?'sel ':'')+(fall?'fall':'')+'" aria-label="Owoc"><span style="font-size:clamp(16px,5vmin,40px)">'+v.fruit+'</span></button>';let c=C[v.c],shape=['8,19 20,5 42,5 54,19 31,56','31,3 55,26 31,57 7,26','15,5 47,5 58,20 48,50 14,50 4,20','31,3 58,24 48,54 14,54 4,24','31,3 52,14 57,38 40,56 16,50 5,27','10,10 49,10 58,31 49,51 10,51 3,31'][v.c];return '<button aria-label="Kryształ '+(i+1)+'" data-i="'+i+'" class="cell '+(selected===i?'sel ':'')+(ice[i]?'ice ':'')+(fall?'fall':'')+'"><svg viewBox="0 0 62 62"><polygon points="'+shape+'" fill="'+c+'" stroke="#d8ffff" stroke-width="1.5"/><path d="M31 5 L12 24 31 55 49 24Z" fill="#fff" opacity=".25"/><path d="M12 24 L49 24 31 55Z" fill="#07162c" opacity=".24"/><path d="M17 14 L28 8 23 18Z" fill="white" opacity=".85"/><text x="31" y="37" font-size="23" text-anchor="middle" fill="white">'+(v.s==='nova'?'✦':v.s==='bomb'?'✹':v.s==='row'?'↔':v.s==='col'?'↕':'')+'</text></svg>'+tag+'</button>'}).join('');hud()}
function build(){mission=level%10===0?'boss':modes[(level-1)%modes.length];tiles=Array(64).fill(null);turn=0;gravity=0;progress=0;goal=mission==='boss'?60+Math.floor(level/5):mission==='special'?3+Math.floor(level/100):0;demoOpen=false;$('demo').style.display='none';document.body.style.background='radial-gradient(ellipse at top,hsl('+((Math.floor((level-1)/25)*43)%360)+' 48% 30%),#071324 70%)';seconds=Math.max(45,85-Math.floor(level/3));fruitGoal=(mission==='fruit'||mission==='key')?Math.min(5,2+Math.floor(level/15)):0;fruitGot=0;fruitSerial=0;base=score;moves=30+Math.min(15,Math.floor(level/30));col=level%6;target=12+Math.min(28,level*2);got=0;hammer=1;armed=false;selected=-1;done=false;busy=false;ice=Array.from({length:64},(_,i)=>level>=3&&(i*13+level*7)%61<Math.min(20,level+2));ice.fill(false);fill();let type=mission==='mixed'?'armor':mission;if(['ice','chain','bomb','stone','vine','treasure','lava','armor','portal','butterfly','platform','shape'].includes(type)){if(type==='shape'){for(let i of [0,1,6,7,8,15,48,55,56,57,62,63])tiles[i]={type:'hole',hp:1}}else{let count=type==='portal'?2:type==='platform'?2:Math.min(10,4+Math.floor(level/60));for(let k=0;k<count;k++){let i=(k*11+level*7)%48+8;tiles[i]={type,hp:type==='bomb'?9:type==='ice'||type==='armor'?2:1}}}fill()}if(mission==='fruit'||mission==='key'){for(let k=0;k<Math.min(2,fruitGoal);k++)b[k*4+1]={fruit:mission==='key'?'🗝️':['🍎','🍐','🍊','🍇','🍒'][fruitSerial++%5]};ice.fill(false)}draw();demo();$('msg').textContent=info[mission];return;/* if(mission==='fruit'||mission==='key'){$('msg').textContent='Zrzuć owoce poza dolną krawędź planszy';return}if(mission==='time'){$('msg').textContent='Zbierz wymagane kryształy przed końcem czasu!';return}$('msg').textContent='Zbierz '+target+' kryształów w kolorze celu '+['czerwonym','niebieskim','zielonym','złotym','fioletowym','pomarańczowym'][col]*/}
async function clear(set,make=new Map()){let q=[...set];for(let i of q){let s=b[i]?.s;if(!s)continue;for(let j=0;j<64;j++){let ok=s==='row'&&Math.floor(j/8)===Math.floor(i/8)||s==='col'&&j%8===i%8||s==='bomb'&&Math.abs(j%8-i%8)<=1&&Math.abs(Math.floor(j/8)-Math.floor(i/8))<=1||s==='nova'&&b[j].c===b[i].c;if(ok&&!set.has(j)){set.add(j);q.push(j)}}}for(let i of [...set])if(b[i]?.fruit||blocked(i)){set.delete(i);make.delete(i)}let damaged=new Set();for(let i of set){for(let j of [i,i-8,i+8,i%8?i-1:-1,i%8<7?i+1:-1]){let t=tiles[j];if(!t||damaged.has(j)||['hole','portal','platform'].includes(t.type))continue;if(j!==i&&!['stone','vine','lava'].includes(t.type))continue;damaged.add(j);if(--t.hp<=0||t.type==='bomb'){tiles[j]=null;score+=40}}}if(mission==='boss')progress+=set.size;if(mission==='special')progress+=make.size;for(let i of set){if(b[i].c===col)got++;ice[i]=false;score+=10;$('board').children[i]?.classList.add('pop')}tone(450+Math.min(12,set.size)*45);await wait(190);for(let i of set)b[i]=make.has(i)?{c:b[i].c,s:make.get(i)}:null;for(let x=0;x<8;x++){let line=Array.from({length:8},(_,k)=>gravity===1?x*8+k:gravity===2?k*8+x:gravity===3?x*8+7-k:(7-k)*8+x);let segment=[];function flush(){let vals=segment.map(i=>b[i]).filter(Boolean);for(let i of segment)b[i]=vals.shift()||{c:rnd()};segment=[]}for(let i of line){if(blocked(i)||tiles[i]?.type==='chain'){flush();if(!b[i])b[i]={c:rnd()}}else segment.push(i)}flush()}if(mission==='fruit'||mission==='key'){for(let pass=0;pass<8;pass++){let changed=false;for(let x=0;x<8;x++){if(b[56+x]?.fruit){fruitGot++;score+=100;changed=true;for(let y=7;y>0;y--)b[y*8+x]=b[(y-1)*8+x];let remaining=b.filter(v=>v?.fruit).length;b[x]=fruitGot+remaining<fruitGoal?{fruit:mission==='key'?'🗝️':['🍎','🍐','🍊','🍇','🍒'][fruitSerial++%5]}:{c:rnd()};tone(980)}}if(!changed)break}}draw(true);await wait(220)}
function hazardTurn(){turn++;if(mission==='gravity')gravity=turn%4;if(mission==='portal'){let a=tiles.map((t,i)=>t?.type==='portal'?i:-1).filter(i=>i>=0);if(a.length===2)swap(...a)}if(mission==='platform'){let row=turn%8,a=b.splice(row*8,8);a.unshift(a.pop());b.splice(row*8,0,...a)}for(let i=0;i<64;i++){let t=tiles[i];if(t?.type==='bomb'&&--t.hp<=0){done=true;$('msg').textContent='Bomba wybuchła — powtórz poziom'}if(t?.type==='butterfly'){if(i<8){done=true;$('msg').textContent='Motyl uciekł — powtórz poziom'}else if(!tiles[i-8]){tiles[i-8]=t;tiles[i]=null}}}if(turn%3===0&&['vine','lava'].includes(mission)){let i=tiles.findIndex(t=>t?.type===mission);if(i>=0){let j=[i+8,i-8,i%8<7?i+1:-1,i%8?i-1:-1].find(j=>j>=0&&j<64&&!tiles[j]);if(j!==undefined)tiles[j]={type:mission,hp:1}}}}function complete(){let empty=!tiles.some(t=>t&&!['hole','portal','platform'].includes(t.type));if(mission==='fruit'||mission==='key')return fruitGot>=fruitGoal;if(goal)return progress>=goal;if(['ice','chain','bomb','stone','vine','treasure','lava','armor','butterfly'].includes(mission))return empty;return got>=target&&(mission!=='mixed'||empty)}async function resolve(rs,preferred){let combo=0;while(rs.length&&combo++<40){let set=new Set(rs.flatMap(r=>r.a)),make=new Map();for(let r of rs){let i=r.a.includes(preferred)?preferred:r.a[Math.floor(r.a.length/2)];if(r.a.length>=4)make.set(i,r.a.length>=5?'nova':r.d===1?'row':'col');for(let other of rs)if(other!==r&&other.d!==r.d){let j=r.a.find(x=>other.a.includes(x));if(j!==undefined)make.set(j,'bomb')}}await clear(set,make);rs=runs()}if(!complete())hazardTurn();if(!done&&runs().length){await clear(new Set(runs().flatMap(r=>r.a)))}draw();if(!hint()){let fruits=b.map((v,i)=>v.fruit?[i,v]:null).filter(Boolean);fill();for(let [i,v] of fruits)b[i]=v;draw();$('msg').textContent='Przetasowano planszę'}report();if(!done&&complete()){done=true;score+=moves*15;report();$('msg').textContent='★ Misja ukończona!';if(level<1000){level++;try{localStorage.setItem('crystals-level',level)}catch{}await wait(1000);build()}}else if(mission==='time'?seconds<=0:moves<=0){done=true;$('msg').textContent='Brak ruchów — powtórz poziom'}hud()}
async function animateSwap(i,j){let a=$('board').children[i],z=$('board').children[j];if(!a||!z)return;let x=a.getBoundingClientRect(),y=z.getBoundingClientRect();if(a.animate){let opts={duration:170,easing:'ease-in-out',fill:'none'};a.animate([{transform:'translate(0,0)'},{transform:'translate('+(y.left-x.left)+'px,'+(y.top-x.top)+'px)'}],opts);z.animate([{transform:'translate(0,0)'},{transform:'translate('+(x.left-y.left)+'px,'+(x.top-y.top)+'px)'}],opts)}await wait(170)}async function move(i,j){if(busy||done||demoOpen||locked(i)||locked(j)||i===j||!(Math.abs(i-j)===8||Math.floor(i/8)===Math.floor(j/8)&&Math.abs(i-j)===1))return;busy=true;selected=-1;await animateSwap(i,j);swap(i,j);draw();let rs=runs();if(b[i].s==='nova'||b[j].s==='nova'){let n=b[i].s==='nova'?i:j,c=b[n===i?j:i].c;let set=new Set([i,j]);b.forEach((v,k)=>{if(v.c===c)set.add(k)});if(mission!=='time')moves--;await clear(set);await resolve(runs(),j)}else if(rs.length){if(mission!=='time')moves--;await resolve(rs,j)}else{await animateSwap(i,j);swap(i,j);draw();tone(120)}busy=false}
let start=-1;$('board').onpointerdown=e=>{let i=Number(e.target.closest('[data-i]')?.dataset.i);if(Number.isInteger(i))start=i};$('board').onpointerup=async e=>{let i=Number(document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-i]')?.dataset.i);if(!Number.isInteger(i)||busy||done||demoOpen||blocked(i))return;if(armed&&hammer&&!b[i].fruit){armed=false;hammer--;busy=true;await clear(new Set([i]));await resolve(runs(),i);busy=false;return}if(start!==i&&start>=0){move(start,i);start=-1;return}if(selected>=0&&selected!==i){let j=selected;selected=-1;move(j,i);draw()}else{selected=i;draw()}};$('hammer').onclick=()=>{if(hammer&&!busy&&!done){armed=true;$('msg').textContent='Wybierz kryształ do usunięcia'}};$('hint').onclick=()=>{let a=hint();if(a){selected=a[0];draw();$('board').children[a[1]].classList.add('sel')}};$('retry').onclick=()=>{if(!busy){score=base;build()}};$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};$('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});$('exit').onclick=()=>{report();document.exitFullscreen?.().catch(()=>{});if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-crystals-exit-fullscreen',game:'crystals'}),location.origin);else location.href='/'};$('share').onclick=()=>{let u=new URL('/share-result.html',location.origin);u.searchParams.set('game','crystals');u.searchParams.set('score',score);if(navigator.share)navigator.share({title:'Genesis Crystals',text:score+' pkt',url:u.href}).catch(()=>{});else window.open(u.href,'_blank')};addEventListener('pagehide',report);build();setInterval(()=>{if(mission==='time'&&!done&&!document.hidden&&!demoOpen){seconds=Math.max(0,seconds-1);hud();if(!seconds&&!busy){done=true;$('msg').textContent='Czas minął — powtórz poziom'}}},1000);
</script>
