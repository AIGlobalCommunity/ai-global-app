<!doctype html><html lang=pl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genesis Crystals</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at top,#284e68,#071324 70%);color:#eafaff;font:600 15px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}header,footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}button{background:#193e54;color:white;border:1px solid #7ad8df;border-radius:9px;padding:8px;cursor:pointer}#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(94vw,58dvh,560px);aspect-ratio:1;touch-action:none;padding:6px;background:#071c2dee;border:2px solid #75c6ce;border-radius:15px;box-shadow:0 0 30px #48d3ff33}.cell{padding:0;min-width:0;aspect-ratio:1;background:#173247;border:1px solid #345469;border-radius:7px;position:relative}.cell svg{width:95%;height:95%;display:block;margin:auto;filter:drop-shadow(0 2px 3px #0009)}.sel{outline:2px solid gold}.ice{box-shadow:inset 0 0 0 4px #95e7ff}.pop{animation:pop .2s forwards}@keyframes pop{to{transform:scale(.15);opacity:0}}.fall{animation:fall .23s ease-out}@keyframes fall{from{transform:translateY(-22%);opacity:.5}}#msg{color:#ffd776;text-align:center;min-height:22px}#hud{font-size:14px}</style><header><button id=exit>✕</button><strong>GENESIS CRYSTALS</strong><button id=full>⛶</button><button id=mute>🔊</button></header><div id=hud></div><div id=board></div><div id=msg></div><footer><button id=hammer>⚒ Młot</button><button id=hint>Podpowiedź</button><button id=retry>Powtórz</button><button id=share>Udostępnij</button></footer><script>
const $=id=>document.getElementById(id),N=8,C=['#fa526e','#39c9ff','#6ee693','#ffd557','#a889ff','#ff984b'];let b=[],ice=[],level=1,score=0,base=0,moves=0,target=0,got=0,col=0,selected=-1,busy=false,done=false,hammer=1,armed=false,sound=true,ac;try{level=Math.max(1,Math.min(100,Number(localStorage.getItem('crystals-level'))||1))}catch{}const rnd=()=>Math.floor(Math.random()*6),wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(f){if(!sound)return;try{ac??=new AudioContext();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.04,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.17)}catch{}}
function report(){if(score<10)return;let p={type:'genesis-game-score',game:'crystals',score,level,at:Date.now()};try{let k='agc-game-pending-crystals',old=JSON.parse(localStorage.getItem(k)||'null');if(!old||old.score<=score)localStorage.setItem(k,JSON.stringify(p))}catch{}if(parent!==window)parent.postMessage(JSON.stringify(p),location.origin)}
function runs(){let out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x,v=b[i];if(!v)continue;for(let d of [1,N]){if(d===1&&x>0&&b[i-1]?.c===v.c||d===N&&y>0&&b[i-N]?.c===v.c)continue;let a=[i],j=i+d;while(j<64&&(d===N||Math.floor(j/N)===y)&&b[j]?.c===v.c){a.push(j);j+=d}if(a.length>=3)out.push({a,d})}}return out}
function swap(i,j){[b[i],b[j]]=[b[j],b[i]]}function hint(){for(let i=0;i<64;i++)for(let j of [i+1,i+8]){if(j>=64||j===i+1&&i%8===7)continue;swap(i,j);let ok=runs().length||b[i]?.s==='nova'||b[j]?.s==='nova';swap(i,j);if(ok)return [i,j]}return null}
function fill(){do{b=[];for(let i=0;i<64;i++){let c;do{c=rnd()}while(i%8>=2&&b[i-1].c===c&&b[i-2].c===c||i>=16&&b[i-8].c===c&&b[i-16].c===c);b.push({c})}}while(!hint())}
function hud(){$('hud').textContent='Poziom '+level+' / 100 · Punkty '+score+' · Ruchy '+moves+' · Cel '+got+'/'+target+(level>=3?' · Lód '+ice.filter(Boolean).length:'');$('hammer').textContent='⚒ Młot '+hammer}
function draw(fall=false){$('board').innerHTML=b.map((v,i)=>{let c=C[v.c],shape=['8,19 20,5 42,5 54,19 31,56','31,3 55,26 31,57 7,26','15,5 47,5 58,20 48,50 14,50 4,20','31,3 58,24 48,54 14,54 4,24','31,3 52,14 57,38 40,56 16,50 5,27','10,10 49,10 58,31 49,51 10,51 3,31'][v.c];return '<button aria-label="Kryształ '+(i+1)+'" data-i="'+i+'" class="cell '+(selected===i?'sel ':'')+(ice[i]?'ice ':'')+(fall?'fall':'')+'"><svg viewBox="0 0 62 62"><polygon points="'+shape+'" fill="'+c+'" stroke="#d8ffff" stroke-width="1.5"/><path d="M31 5 L12 24 31 55 49 24Z" fill="#fff" opacity=".25"/><path d="M12 24 L49 24 31 55Z" fill="#07162c" opacity=".24"/><path d="M17 14 L28 8 23 18Z" fill="white" opacity=".85"/><text x="31" y="37" font-size="23" text-anchor="middle" fill="white">'+(v.s==='nova'?'✦':v.s==='bomb'?'✹':v.s==='row'?'↔':v.s==='col'?'↕':'')+'</text></svg></button>'}).join('');hud()}
function build(){base=score;moves=25+Math.floor(level/10);col=level%6;target=12+Math.min(28,level*2);got=0;hammer=1;armed=false;selected=-1;done=false;busy=false;ice=Array.from({length:64},(_,i)=>level>=3&&(i*13+level*7)%61<Math.min(20,level+2));fill();draw();$('msg').textContent='Zbierz '+target+' kryształów w kolorze celu '+['czerwonym','niebieskim','zielonym','złotym','fioletowym','pomarańczowym'][col]}
async function clear(set,make=new Map()){let q=[...set];for(let i of q){let s=b[i]?.s;if(!s)continue;for(let j=0;j<64;j++){let ok=s==='row'&&Math.floor(j/8)===Math.floor(i/8)||s==='col'&&j%8===i%8||s==='bomb'&&Math.abs(j%8-i%8)<=1&&Math.abs(Math.floor(j/8)-Math.floor(i/8))<=1||s==='nova'&&b[j].c===b[i].c;if(ok&&!set.has(j)){set.add(j);q.push(j)}}}for(let i of set){if(b[i].c===col)got++;ice[i]=false;score+=10;$('board').children[i]?.classList.add('pop')}tone(450+Math.min(12,set.size)*45);await wait(190);for(let i of set)b[i]=make.has(i)?{c:b[i].c,s:make.get(i)}:null;for(let x=0;x<8;x++){let vals=[];for(let y=7;y>=0;y--)if(b[y*8+x])vals.push(b[y*8+x]);for(let y=7;y>=0;y--)b[y*8+x]=vals.shift()||{c:rnd()}}draw(true);await wait(220)}
async function resolve(rs,preferred){let combo=0;while(rs.length&&combo++<40){let set=new Set(rs.flatMap(r=>r.a)),make=new Map();for(let r of rs){let i=r.a.includes(preferred)?preferred:r.a[Math.floor(r.a.length/2)];if(r.a.length>=4)make.set(i,r.a.length>=5?'nova':r.d===1?'row':'col');for(let other of rs)if(other!==r&&other.d!==r.d){let j=r.a.find(x=>other.a.includes(x));if(j!==undefined)make.set(j,'bomb')}}await clear(set,make);rs=runs()}if(!hint()){fill();draw();$('msg').textContent='Przetasowano planszę'}report();if(got>=target&&!ice.some(Boolean)){done=true;score+=moves*15;report();$('msg').textContent='★ Misja ukończona!';if(level<100){level++;try{localStorage.setItem('crystals-level',level)}catch{}await wait(1000);build()}}else if(moves<=0){done=true;$('msg').textContent='Brak ruchów — powtórz poziom'}hud()}
async function move(i,j){if(busy||done||i===j||!(Math.abs(i-j)===8||Math.floor(i/8)===Math.floor(j/8)&&Math.abs(i-j)===1))return;busy=true;selected=-1;swap(i,j);draw();let rs=runs();if(b[i].s==='nova'||b[j].s==='nova'){let n=b[i].s==='nova'?i:j,c=b[n===i?j:i].c;let set=new Set([i,j]);b.forEach((v,k)=>{if(v.c===c)set.add(k)});moves--;await clear(set);await resolve(runs(),j)}else if(rs.length){moves--;await resolve(rs,j)}else{await wait(130);swap(i,j);draw();tone(120)}busy=false}
let start=-1;$('board').onpointerdown=e=>{let i=Number(e.target.closest('[data-i]')?.dataset.i);if(Number.isInteger(i))start=i};$('board').onpointerup=async e=>{let i=Number(document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-i]')?.dataset.i);if(!Number.isInteger(i)||busy||done)return;if(armed&&hammer){armed=false;hammer--;busy=true;await clear(new Set([i]));await resolve(runs(),i);busy=false;return}if(start!==i&&start>=0){move(start,i);start=-1;return}if(selected>=0&&selected!==i){let j=selected;selected=-1;move(j,i);draw()}else{selected=i;draw()}};$('hammer').onclick=()=>{if(hammer&&!busy&&!done){armed=true;$('msg').textContent='Wybierz kryształ do usunięcia'}};$('hint').onclick=()=>{let a=hint();if(a){selected=a[0];draw();$('board').children[a[1]].classList.add('sel')}};$('retry').onclick=()=>{if(!busy){score=base;build()}};$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'🔊':'🔇'};$('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});$('exit').onclick=()=>{report();document.exitFullscreen?.().catch(()=>{});if(parent!==window)parent.postMessage(JSON.stringify({type:'genesis-crystals-exit-fullscreen',game:'crystals'}),location.origin);else location.href='/'};$('share').onclick=()=>{let u=new URL('/share-result.html',location.origin);u.searchParams.set('game','crystals');u.searchParams.set('score',score);if(navigator.share)navigator.share({title:'Genesis Crystals',text:score+' pkt',url:u.href}).catch(()=>{});else window.open(u.href,'_blank')};addEventListener('pagehide',report);build();
</script>
