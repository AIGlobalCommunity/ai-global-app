const $=id=>document.getElementById(id),N=8,C=['#fa526e','#39c9ff','#6ee693','#ffd557','#a889ff','#ff984b'];let tiles=[],goal=0,progress=0,turn=0,gravity=0,seen=new Set(),demoOpen=false;try{seen=new Set(JSON.parse(localStorage.getItem('crystals-demo')||'[]'))}catch{}const modes=['color','time','fruit','ice','chain','bomb','stone','vine','key','treasure','portal','gravity','lava','special','butterfly','tank','armor','platform','shape','mixed'];const info={color:'Zbieraj wskazany kolor',time:'Zbieraj kryształy przed upływem czasu',fruit:'Zrzuć owoce na dół',ice:'Rozbij wszystkie warstwy lodu',chain:'Dopasuj kryształy w łańcuchach',bomb:'Usuń bomby zanim licznik spadnie do zera',stone:'Twórz kombinacje obok kamieni',vine:'Usuwaj pnącza zanim się rozrosną',key:'Zrzuć klucze do skrzyń',treasure:'Odkryj skarby pod kryształami',boss:'Atakuj bossa każdą kombinacją',portal:'Portale zamieniają kryształy po kaskadzie',gravity:'Grawitacja zmienia kierunek po ruchu',lava:'Zatrzymaj lawę kombinacjami obok niej',special:'Utwórz specjalne kryształy',butterfly:'Dopasuj kolor motyla przed dotarciem do góry',tank:'Napełnij zbiornik wskazanym kolorem',armor:'Rozbij warstwy pancerza',platform:'Ruchome rzędy zmieniają położenie kryształów',shape:'Graj w nieregularnym układzie',mixed:'Zbierz kolor i usuń przeszkody'};let mission='color',seconds=0,fruitGoal=0,fruitGot=0,fruitSerial=0;let b=[],ice=[],level=1,score=0,base=0,moves=0,target=0,got=0,col=0,selected=-1,busy=false,done=false,hammer=1,armed=false,sound=true,ac;try{level=Math.max(1,Math.min(1000,Number(localStorage.getItem('crystals-level'))||1))}catch{}const rnd=()=>Math.floor(Math.random()*6),wait=ms=>new Promise(r=>setTimeout(r,ms));function unlockAudio(){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!ac&&A)ac=new A();if(ac?.state==='suspended')ac.resume().catch(()=>{});if(ac){let src=ac.createBufferSource();src.buffer=ac.createBuffer(1,1,ac.sampleRate);src.connect(ac.destination);src.start()}}catch const mark={ice:'🧊',chain:'⛓',bomb:'💣',stone:'🪨',vine:'🌿',treasure:'🏆',lava:'🔥',armor:'🛡',portal:'🌀',butterfly:'🦋',hole:'',platform:'↔'};const blocked=i=>tiles[i]?.type==='hole'||tiles[i]?.type==='stone';const locked=i=>blocked(i)||tiles[i]?.type==='chain';function demo(){if(seen.has(mission))return;demoOpen=true;$('demoTitle').textContent='Nowa misja: '+mission;$('demoIcon').textContent=mark[mission]||'💎 ✨ 💎';$('demoText').textContent=info[mission];$('demo').style.display='grid'}$('demoOk').onclick=()=>{seen.add(mission);try{localStorage.setItem('crystals-demo',JSON.stringify([...seen]))}catch{}demoOpen=false;$('demo').style.display='none'};function runs(){let out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x,v=b[i];if(!v||v.fruit||blocked(i))continue;for(let d of [1,N]){if(d===1&&x>0&&!blocked(i-1)&&!b[i-1]?.fruit&&b[i-1]?.c===v.c||d===N&&y>0&&!blocked(i-N)&&!b[i-N]?.fruit&&b[i-N]?.c===v.c)continue;let a=[i],j=i+d;while(j<64&&(d===N||Math.floor(j/N)===y)&&!blocked(j)&&!b[j]?.fruit&&b[j]?.c===v.c){a.push(j);j+=d}if(a.length>=3)out.push({a,d})}}return out}

function goalGem(c){return '<svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="8,4 32,4 39,16 20,38 1,16" fill="'+C[c]+'" stroke="#fff" stroke-width="1.4"/><path d="M8 4 20 38 32 4 M1 16H39" fill="none" stroke="#fff" opacity=".55"/><path d="M8 5 16 7 9 14Z" fill="white"/></svg>'}function goalsHud(){let cards=[];function add(icon,n,label){cards.push('<div class="goalcard '+(n<=0?'complete':'')+'">'+icon+'<strong>'+(n<=0?'✓':n)+'</strong><small>'+label+'</small></div>')}if(['fruit','key'].includes(mission))add(mission==='key'?'🗝️':'🍎',Math.max(0,fruitGoal-fruitGot),'Pozostało');else if(goal)add(mission==='boss'?'👾':'✦',Math.max(0,goal-progress),'Pozostało');else if(!['ice','chain','bomb','stone','vine','treasure','lava','armor','butterfly'].includes(mission))add(goalGem(col),Math.max(0,target-got),'Pozostało');let counts={};for(let t of tiles)if(t&&!['hole','portal','platform'].includes(t.type))counts[t.type]=(counts[t.type]||0)+1;for(let [type,n] of Object.entries(counts))add(mark[type]||'◆',n,'Pozostało');if(mission==='time')add('⏱',seconds,'sek.');$('goals').innerHTML=cards.join('')}function hud(){goalsHud();$('hud').textContent='Poziom '+level+' / 1000 · Punkty '+score+(mission==='time'?' · Czas '+seconds+' s':' · Ruchy '+moves)+(mission==='fruit'?' · Owoce '+fruitGot+'/'+fruitGoal:' · Cel '+got+'/'+target)+' · '+info[mission]+(goal?' '+progress+'/'+goal:'')+(tiles.some(t=>t&&!['hole','portal','platform'].includes(t.type))?' · Przeszkody '+tiles.filter(t=>t&&!['hole','portal','platform'].includes(t.type)).length:'');$('hammer').textContent='⚒ Młot '+hammer}

function build(){mission=level%10===0?'boss':modes[(level-1)%modes.length];tiles=Array(64).fill(null);turn=0;gravity=0;progress=0;goal=mission==='boss'?60+Math.floor(level/5):mission==='special'?3+Math.floor(level/100):0;demoOpen=false;$('demo').style.display='none';document.body.style.background='radial-gradient(ellipse at top,hsl('+((Math.floor((level-1)/25)*43)%360)+' 48% 30%),#071324 70%)';seconds=Math.max(45,85-Math.floor(level/3));fruitGoal=(mission==='fruit'||mission==='key')?Math.min(5,2+Math.floor(level/15)):0;fruitGot=0;fruitSerial=0;base=score;moves=30+Math.min(15,Math.floor(level/30));col=level%6;target=12+Math.min(28,level*2);got=0;hammer=1;armed=false;selected=-1;done=false;busy=false;ice=Array.from({length:64},(_,i)=>level>=3&&(i*13+level*7)%61<Math.min(20,level+2));ice.fill(false);fill();let type=mission==='mixed'?'armor':mission;if(['ice','chain','bomb','stone','vine','treasure','lava','armor','portal','butterfly','platform','shape'].includes(type)){if(type==='shape'){for(let i of [0,1,6,7,8,15,48,55,56,57,62,63])tiles[i]={type:'hole',hp:1}}else{let count=type==='portal'?2:type==='platform'?2:Math.min(10,4+Math.floor(level/60));for(let k=0;k<count;k++){let i=(k*11+level*7)%48+8;tiles[i]={type,hp:type==='bomb'?9:type==='ice'||type==='armor'?2:1}}}fill()}if(mission==='fruit'||mission==='key'){for(let k=0;k<Math.min(2,fruitGoal);k++)b[k*4+1]={fruit:mission==='key'?'🗝️':['🍎','🍐','🍊','🍇','🍒'][fruitSerial++%5]};ice.fill(false)}draw();demo();$('msg').textContent=info[mission];return;/* if(mission==='fruit'||mission==='key'){$('msg').textContent='Zrzuć owoce poza dolną krawędź planszy';return}if(mission==='time'){$('msg').textContent='Zbierz wymagane kryształy przed końcem czasu!';return}$('msg').textContent='Zbierz '+target+' kryształów w kolorze celu '+['czerwonym','niebieskim','zielonym','złotym','fioletowym','pomarańczowym'][col]*/}

function hazardTurn(){turn++;if(mission==='gravity')gravity=turn%4;if(mission==='portal'){let a=tiles.map((t,i)=>t?.type==='portal'?i:-1).filter(i=>i>=0);if(a.length===2)swap(...a)}if(mission==='platform'){let row=turn%8,a=b.splice(row*8,8);a.unshift(a.pop());b.splice(row*8,0,...a)}for(let i=0;i<64;i++){let t=tiles[i];if(t?.type==='bomb'&&--t.hp<=0){done=true;$('msg').textContent='Bomba wybuchła — powtórz poziom'}if(t?.type==='butterfly'){if(i<8){done=true;$('msg').textContent='Motyl uciekł — powtórz poziom'}else if(!tiles[i-8]){tiles[i-8]=t;tiles[i]=null}}}if(turn%3===0&&['vine','lava'].includes(mission)){let i=tiles.findIndex(t=>t?.type===mission);if(i>=0){let j=[i+8,i-8,i%8<7?i+1:-1,i%8?i-1:-1].find(j=>j>=0&&j<64&&!tiles[j]);if(j!==undefined)tiles[j]={type:mission,hp:1}}}}function complete(){let empty=!tiles.some(t=>t&&!['hole','portal','platform'].includes(t.type));if(mission==='fruit'||mission==='key')return fruitGot>=fruitGoal;if(goal)return progress>=goal;if(['ice','chain','bomb','stone','vine','treasure','lava','armor','butterfly'].includes(mission))return empty;return got>=target&&(mission!=='mixed'||empty)}async function resolve(rs,preferred){let combo=0;while(rs.length&&combo++<40){let set=new Set(rs.flatMap(r=>r.a)),make=new Map();for(let r of rs){let i=r.a.includes(preferred)?preferred:r.a[Math.floor(r.a.length/2)];if(r.a.length>=4)make.set(i,r.a.length>=5?'nova':r.d===1?'row':'col');for(let other of rs)if(other!==r&&other.d!==r.d){let j=r.a.find(x=>other.a.includes(x));if(j!==undefined)make.set(j,'bomb')}}await clear(set,make);rs=runs()}if(!complete())hazardTurn();if(!done&&runs().length){await clear(new Set(runs().flatMap(r=>r.a)))}draw();if(!hint()){let fruits=b.map((v,i)=>v.fruit?[i,v]:null).filter(Boolean);fill();for(let [i,v] of fruits)b[i]=v;draw();$('msg').textContent='Przetasowano planszę'}report();if(!done&&complete()){done=true;score+=moves*15;report();$('msg').textContent='★ Misja ukończona!';if(level<1000){level++;try{localStorage.setItem('
