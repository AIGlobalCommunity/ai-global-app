</div><script>
(function(){

ctx.font=Math.max(19,Math.min(width,height)*.065)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n===active?'🧺':'○',p.ex,p.ey)}

 ctx.fillStyle='#fff5dd';ctx.beginPath();ctx.ellipse(cw*.50,ch*.66,cw*.20,ch*.17,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.arc(cw*.62,ch*.53,ch*.105,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#e43d32';ctx.beginPath();ctx.arc(cw*.60,ch*.42,ch*.052,0,Math.PI*2);ctx.arc(cw*.67,ch*.44,ch*.045,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f4b12f';ctx.beginPath();ctx.moveTo(cw*.72,ch*.55);ctx.lineTo(cw*.85,ch*.59);ctx.lineTo(cw*.72,ch*.63);ctx.fill();
 ctx.fillStyle='#182533';ctx.beginPath();ctx.arc(cw*.66,ch*.53,Math.max(1.4,cw*.012),0,Math.PI*2);ctx.fill();
 ctx.restore();
}
// Rustic farm fence and grass accents.
ctx.fillStyle='#194c36';ctx.fillRect(0,height*.94,width,height*.06);
ctx.fillStyle='#7fbf4b';ctx.fillRect(0,height*.945,width,height*.012);
for(let x=0;x<width;x+=Math.max(26,width*.07)){
 ctx.fillStyle='#a66b32';ctx.fillRect(x,height*.91,Math.max(5,width*.009),height*.07);
 ctx.fillStyle='#d99a4a';ctx.fillRect(x,height*.925,Math.max(28,width*.075),Math.max(4,height*.012));

const cx=width*.5,cy=height*.5,unit=Math.min(width,height),bounce=Math.sin(jump*Math.PI)*unit*.055;

ctx.fillStyle='#1451b7';ctx.beginPath();ctx.ellipse(cx,cy+unit*.072,unit*.078,unit*.13,0,0,Math.PI*2);ctx.fill();

ctx.beginPath();ctx.moveTo(cx,cy+unit*.005);ctx.lineTo(cx+dx*.40,cy+dy*.39);ctx.lineTo(handX,handY+bounce);ctx.stroke();
ctx.strokeStyle='#5c7184';ctx.lineWidth=unit*.038;ctx.beginPath();ctx.moveTo(cx,cy+unit*.02);ctx.lineTo(cx-dx*.23,cy-dy*.22);ctx.stroke();

ctx.beginPath();ctx.moveTo(cx+unit*.068,cy-unit*.092);ctx.lineTo(cx+unit*.076,cy-unit*.18);ctx.lineTo(cx+unit*.018,cy-unit*.115);ctx.fill();
ctx.fillStyle='#f2f3ef';ctx.beginPath();ctx.ellipse(cx,cy-unit*.025,unit*.047,unit*.039,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#1c2937';ctx.beginPath();ctx.arc(cx-unit*.028,cy-unit*.07,unit*.008,0,Math.PI*2);ctx.arc(cx+unit*.028,cy-unit*.07,unit*.008,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#273541';ctx.beginPath();ctx.arc(cx,cy-unit*.035,unit*.016,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e53b34';ctx.beginPath();ctx.moveTo(cx-unit*.04,cy+unit*.015);ctx.lineTo(cx+unit*.04,cy+unit*.015);ctx.lineTo(cx,cy+unit*.065);ctx.fill();ctx.restore();
ctx.fillStyle='#eab86c';ctx.beginPath();ctx.ellipse(handX,handY,unit*.055,unit*.031,Math.atan2(dy,dx),0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#ffe5a5';ctx.lineWidth=2;ctx.stroke();
for(const egg of eggs){const p=lanePoints(egg.lane),x=p.sx+(p.ex-p.sx)*egg.p,y=p.sy+(p.ey-p.sy)*egg.p;ctx.save();ctx.translate(x,y);ctx.rotate(egg.spin*egg.p);ctx.fillStyle='#fff5d9';ctx.beginPath();ctx.ellipse(0,0,Math.max(7,unit*.025),Math.max(10,unit*.035),0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#dfc5a0';ctx.lineWidth=2;ctx.stroke();ctx.restore()}

roundRect(width*.02,height*.025,width*.16,Math.max(20,height*.06),8,'#061a2b99');ctx.font=Math.max(10,Math.min(width,height)*.035)+'px system-ui';ctx.fillStyle='#bde9f6';ctx.textAlign='center';ctx.fillText('GENESIS',width*.10,height*.055)}
resize();
