name: ai_global_community
description: THE GENESIS ERA global community Flutter web app
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.1
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  share_plus: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/agc_genesis_luxury.png
    - assets/agc_genesis_ai_vector.svg
    - assets/agc_cosmic_background_hd.svg
    - assets/genesis_signal_card.svg
    - assets/genesis_defender_card.svg
