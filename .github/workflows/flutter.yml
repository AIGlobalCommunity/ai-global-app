name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Initialize platforms if missing
        run: flutter create --platforms=android,ios,web .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: agc-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Build production web
        run: flutter build web --release --base-href / --pwa-strategy=none
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: agc-web-release
          path: build/web
