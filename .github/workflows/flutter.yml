name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Initialize web platform
        run: flutter create --platforms=web .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build production web
        run: flutter build web --release --base-href / --pwa-strategy=none
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: agc-web-release
          path: build/web
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.9'
          cache: true
      - name: Initialize Android platform
        run: flutter create --platforms=android .
      - run: flutter pub get
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android with bounded network retries
        shell: bash
        run: |
          set -o pipefail
          for delay in 0 60 180 300; do
            sleep "$delay"
            if flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
              exit 0
            fi
            if ! grep -Eqi '429|Too Many Requests|503 Service Unavailable|Connection timed out' "$RUNNER_TEMP/android-build.log"; then
              exit 1
            fi
            echo "Transient dependency download failure; retrying with backoff."
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: agc-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
