name: Publish AGC Safari Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agc-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter web platform
        run: flutter create --platforms=web .
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: |
          flutter analyze
          flutter test
      - name: Build production site at thegenesisera.com
        run: flutter build web --release --base-href / --pwa-strategy=none --dart-define=AGC_BUILD_VERSION=${GITHUB_SHA::8} --dart-define=AGC_BUILD_DATE=$(date -u +%Y%m%d-%H%M)
      - name: Set browser tab title and Genesis favicon
        run: |
          cp assets/agc_genesis_ai_vector.svg build/web/favicon.svg
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('build/web/index.html')
          html = page.read_text(encoding='utf-8')
          html, titles = re.subn(
              r'<title>.*?</title>',
              '<title>THE GENESIS ERA | AI Global Community</title>',
              html, count=1, flags=re.DOTALL | re.IGNORECASE,
          )
          if titles != 1:
              raise SystemExit('Expected a title tag in Flutter web/index.html')
          html = re.sub(
              r'<link[^>]+rel=["\'](?:shortcut )?icon["\'][^>]*>\s*',
              '', html, flags=re.IGNORECASE,
          )
          head = (
              '  <link rel="icon" type="image/svg+xml" href="favicon.svg">\n'
              '  <meta name="application-name" content="THE GENESIS ERA">\n'
              '  <meta name="apple-mobile-web-app-title" content="THE GENESIS ERA">\n'
              '  <meta name="theme-color" content="#071322">\n'
              '  <script>\n'
              '  if ("serviceWorker" in navigator) {\n'
              '    navigator.serviceWorker.getRegistrations().then(function(regs) {\n'
              '      if (!regs.length) return;\n'
              '      Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {\n'
              '        if (!sessionStorage.getItem("genesis-sw-refresh-20261019")) {\n'
              '          sessionStorage.setItem("genesis-sw-refresh-20261019", "1");\n'
              '          location.reload();\n'
              '        }\n'
              '      });\n'
              '    });\n'
              '  }\n'
              '  </script>\n'
          )
          if '</head>' not in html:
              raise SystemExit('Missing HTML head')
          page.write_text(html.replace('</head>', head + '</head>', 1), encoding='utf-8')
          PY
          test -s build/web/favicon.svg
          grep -q 'THE GENESIS ERA | AI Global Community' build/web/index.html
      - name: Verify bundled HTML5 Genesis Signal game
        run: |
          test -s build/web/genesis-game.html
          test -s build/web/genesis-defender.html
          test -s build/web/assets/assets/genesis_signal_cinematic.jpg
          test -s build/web/assets/assets/genesis_defender_cinematic.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('genesis-game', 'genesis-defender'):
              page = Path(f'build/web/{name}.html').read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', page, re.DOTALL)
              if len(scripts) != 1:
                  raise SystemExit(f'Expected one self-contained {name} game script')
              Path(f'/tmp/{name}-check.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/genesis-game-check.js
          node --check /tmp/genesis-defender-check.js
          echo "Both HTML5 games bundled and JavaScript syntax verified"
      - name: Verify bundled AGC artwork
        run: |
          test -s build/web/assets/assets/agc_cosmic_background_hd.svg
          test -s build/web/assets/assets/agc_genesis_ai_vector.svg
          echo "AGC cosmic HD background and vector Genesis logo are present in the release bundle"
      - name: Configure GitHub Pages custom domain
        run: echo 'thegenesisera.com' > build/web/CNAME
      - name: Stop Jekyll processing
        run: touch build/web/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy public preview
        uses: actions/deploy-pages@v4
