name: Publish AGC Safari Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agc-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Flutter web platform
        run: flutter create --platforms=web .
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build production site at thegenesisera.com
        run: flutter build web --release --base-href / --pwa-strategy=none --dart-define=AGC_BUILD_VERSION=${GITHUB_SHA::8} --dart-define=AGC_BUILD_DATE=$(date -u +%Y%m%d-%H%M)
      - name: Set browser tab title and Genesis favicon
        run: |
          cp assets/agc_genesis_ai_vector.svg build/web/favicon.svg
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('build/web/index.html')
          html = page.read_text(encoding='utf-8')
          html, titles = re.subn(
              r'<title>.*?</title>',
              '<title>THE GENESIS ERA | AI Global Community</title>',
              html, count=1, flags=re.DOTALL | re.IGNORECASE,
          )
          if titles != 1:
              raise SystemExit('Expected a title tag in Flutter web/index.html')
          html = re.sub(
              r'<link[^>]+rel=["\'](?:shortcut )?icon["\'][^>]*>\s*',
              '', html, flags=re.IGNORECASE,
          )
          head = (
              '  <link rel="icon" type="image/svg+xml" href="favicon.svg">\n'
              '  <meta name="application-name" content="THE GENESIS ERA">\n'
              '  <meta name="apple-mobile-web-app-title" content="THE GENESIS ERA">\n'
              '  <meta name="theme-color" content="#071322">\n'
              '  <script>\n'
              '  if ("serviceWorker" in navigator) {\n'
              '    navigator.serviceWorker.getRegistrations().then(function(regs) {\n'
              '      if (!regs.length) return;\n'
              '      Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {\n'
              '        if (!sessionStorage.getItem("genesis-sw-refresh-20261019")) {\n'
              '          sessionStorage.setItem("genesis-sw-refresh-20261019", "1");\n'
              '          location.reload();\n'
              '        }\n'
              '      });\n'
              '    });\n'
              '  }\n'
              '  </script>\n'
          )
          if '</head>' not in html:
              raise SystemExit('Missing HTML head')
          page.write_text(html.replace('</head>', head + '</head>', 1), encoding='utf-8')
          PY
          test -s build/web/favicon.svg
          grep -q 'THE GENESIS ERA | AI Global Community' build/web/index.html
      - name: Verify all bundled HTML5 games and scripts
        run: |
          test -s build/web/assets/assets/genesis_signal_cinematic.jpg
          test -s build/web/assets/assets/genesis_defender_cinematic.jpg
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import subprocess
          import tempfile

          root = Path('build/web').resolve()
          names = ('genesis-game', 'genesis-defender', 'genesis-wolf-eggs',
                   'genesis-blocks', 'genesis-snake', 'skoki-narciarskie',
                   'genesis-maze', 'genesis-slingshot', 'genesis-crystals')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.current = [dict(attrs), '']
              def handle_data(self, data):
                  if self.current is not None:
                      self.current[1] += data
              def handle_endtag(self, tag):
                  if tag == 'script' and self.current is not None:
                      self.blocks.append(self.current)
                      self.current = None

          checked = set()
          with tempfile.TemporaryDirectory() as tmp:
              for name in names:
                  page = root / f'{name}.html'
                  parser = Scripts()
                  parser.feed(page.read_text(encoding='utf-8'))
                  if parser.current is not None or not parser.blocks:
                      raise SystemExit(f'Missing or unclosed script in {name}')
                  for i, (attrs, code) in enumerate(parser.blocks):
                      kind = attrs.get('type', '').lower()
                      if kind not in ('', 'text/javascript', 'application/javascript', 'module'):
                          continue
                      if 'src' in attrs:
                          url = urlsplit(attrs['src'])
                          if url.scheme or url.netloc:
                              continue
                          file = (root / url.path.lstrip('/')).resolve()
                          if not file.is_relative_to(root) or not file.is_file() or not file.stat().st_size:
                              raise SystemExit(f'Missing local script: {name}: {url.path}')
                          if file in checked:
                              continue
                          checked.add(file)
                      elif code.strip():
                          file = Path(tmp) / f'{name}-{i}.{"mjs" if kind == "module" else "js"}'
                          file.write_text(code, encoding='utf-8')
                      else:
                          continue
                      print(f'Checking {name}: {file.name}', flush=True)
                      subprocess.run(['node', '--check', str(file)], check=True)
                  if not any(code.strip() and 'src' not in attrs for attrs, code in parser.blocks):
                      raise SystemExit(f'Missing inline game logic: {name}')
          PY
          echo "All nine HTML5 games bundled and JavaScript syntax verified"
      - name: Verify bundled AGC artwork
        run: |
          test -s build/web/assets/assets/agc_cosmic_background_hd.svg
          test -s build/web/assets/assets/agc_genesis_ai_vector.svg
          echo "AGC cosmic HD background and vector Genesis logo are present in the release bundle"
      - name: Configure GitHub Pages custom domain
        run: echo 'thegenesisera.com' > build/web/CNAME
      - name: Stop Jekyll processing
        run: touch build/web/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy public preview
        uses: actions/deploy-pages@v4
