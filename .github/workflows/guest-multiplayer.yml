name: Guest Multiplayer CI
on:
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'test/guest_multiplayer_contract.test.mjs'
      - 'test/guest_multiplayer_live.test.ts'
      - '.github/workflows/guest-multiplayer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Shared QR and guest permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/guest_multiplayer_contract.test.mjs

  edge:
    name: Edge Functions TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check invitation and authoritative game servers
        run: |
          deno check supabase/functions/game-invite/index.ts
          deno check supabase/functions/duck-game/index.ts
          deno check supabase/functions/hearts-game/index.ts
          deno check supabase/functions/blackjack-game/index.ts
      - name: "Real API smoke test: anonymous host, QR, second player and gameplay"
        run: deno test --allow-net test/guest_multiplayer_live.test.ts
